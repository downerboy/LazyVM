<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 692" width="1030" height="692" role="img" aria-labelledby="t-export-template">
<title id="t-export-template">Save a VM as a config template: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="692"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,502"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,188 L335,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,278 L335,278" marker-end="url(#ac)"/>
<path class="df" d="M275,300 L335,300" marker-end="url(#ad)"/>
<path class="cl" d="M305,390 L335,390" marker-end="url(#ac)"/>
<path class="df" d="M275,412 L335,412" marker-end="url(#ad)"/>
<path class="cl" d="M305,502 L335,502" marker-end="url(#ac)"/>
<path class="df" d="M275,524 L335,524" marker-end="url(#ad)"/>
<path class="df" d="M640,524 L740,524" marker-end="url(#ad)"/>
<path class="df" d="M640,620 L740,620" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="300" r="10"/><text x="293" y="303.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="412" r="10"/><text x="293" y="415.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="524" r="10"/><text x="293" y="527.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="524" r="10"/><text x="690" y="527.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="620" r="10"/><text x="690" y="623.5" text-anchor="middle">D6</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Export-LazyVMTemplate</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-TemplateName &lt;Template&gt; (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">the LazyVM folder</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">HKLM:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="258" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="272" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="288" text-anchor="middle">Resolve-VMSelection()</text>
<line class="div" x1="335" y1="295" x2="640" y2="295"/>
<g class="sn"><circle cx="351" cy="279" r="10"/><text x="351" y="283" text-anchor="middle">2</text></g>
<text class="at" x="345" y="310">the VM named, or the only one there is</text>
</g>
<g class="bx-store"><rect x="20" y="258" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="272" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="288" text-anchor="middle">&lt;Root&gt;\</text>
<line class="div" x1="20" y1="295" x2="275" y2="295"/>
<text class="at" x="30" y="310">*\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="370" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="384" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="400" text-anchor="middle">Assert-TemplateNameAvailable()</text>
<line class="div" x1="335" y1="407" x2="640" y2="407"/>
<g class="sn"><circle cx="351" cy="391" r="10"/><text x="351" y="395" text-anchor="middle">3</text></g>
<text class="at" x="345" y="422">stops unless the name is valid and no</text>
<text class="at" x="345" y="439">template, built-in or yours, has it</text>
</g>
<g class="bx-store"><rect x="20" y="370" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="384" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="400" text-anchor="middle">Config templates</text>
<line class="div" x1="20" y1="407" x2="275" y2="407"/>
<text class="at" x="30" y="422">Data\Templates\*.json</text>
<text class="at" x="30" y="439">Shared\Templates\*.json</text>
</g>
<g class="bx-mod"><rect x="335" y="482" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="496" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="512" text-anchor="middle">Export-VMTemplate()</text>
<line class="div" x1="335" y1="519" x2="640" y2="519"/>
<g class="sn"><circle cx="351" cy="503" r="10"/><text x="351" y="507" text-anchor="middle">4</text></g>
<text class="at" x="345" y="534">the VM&apos;s settings and tooling list,</text>
<text class="at" x="345" y="551">without the ones each VM has its own of</text>
</g>
<g class="bx-store"><rect x="20" y="482" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="496" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="512" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="20" y1="519" x2="275" y2="519"/>
<text class="at" x="30" y="534">VM.json</text>
</g>
<g class="bx-store"><rect x="740" y="482" width="270" height="84" rx="3"/>
<text class="st" x="875" y="496" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="512" text-anchor="middle">Shared\Templates\</text>
<line class="div" x1="740" y1="519" x2="1010" y2="519"/>
<text class="at" x="750" y="534">&lt;Template&gt;.json</text>
</g>
<g class="bx-store"><rect x="740" y="578" width="270" height="84" rx="3"/>
<text class="st" x="875" y="592" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="608" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="615" x2="1010" y2="615"/>
<text class="at" x="750" y="630">FileInfo</text>
</g>
</svg>
