<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 922" width="1030" height="922" role="img" aria-labelledby="t-license">
<title id="t-license">Check the license: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="922"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,794"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,205 L335,205" marker-end="url(#ad)"/>
<path class="df" d="M640,188 L740,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,312 L335,312" marker-end="url(#ac)"/>
<path class="cl" d="M305,424 L335,424" marker-end="url(#ac)"/>
<path class="df" d="M275,446 L335,446" marker-end="url(#ad)"/>
<path class="df" d="M640,446 L740,446" marker-end="url(#ad)"/>
<path class="cl" d="M305,553 L335,553" marker-end="url(#ac)"/>
<path class="df" d="M275,575 L335,575" marker-end="url(#ad)"/>
<path class="cl" d="M305,665 L335,665" marker-end="url(#ac)"/>
<path class="df" d="M275,687 L335,687" marker-end="url(#ad)"/>
<path class="cl" d="M305,794 L335,794" marker-end="url(#ac)"/>
<path class="df" d="M640,833 L740,833" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="205" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690" cy="188" r="10"/><text x="690" y="191.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="446" r="10"/><text x="293" y="449.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690" cy="446" r="10"/><text x="690" y="449.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="575" r="10"/><text x="293" y="578.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="687" r="10"/><text x="293" y="690.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="833" r="10"/><text x="690" y="836.5" text-anchor="middle">D7</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Get-LazyVMLicense</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">builds the VM context and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">HKLM:\SOFTWARE\LazyVM Root</text>
<text class="at" x="30" y="215">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="232">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="146" width="270" height="84" rx="3"/>
<text class="st" x="875" y="160" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="176" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="183" x2="1010" y2="183"/>
<text class="at" x="750" y="198">&lt;VM&gt;.log (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="292" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="306" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="322" text-anchor="middle">Get-LicenseReport()</text>
<line class="div" x1="335" y1="329" x2="640" y2="329"/>
<g class="sn"><circle cx="351" cy="313" r="10"/><text x="351" y="317" text-anchor="middle">2</text></g>
<text class="at" x="345" y="344">steps 3-6 are its calls</text>
</g>
<g class="bx-mod"><rect x="335" y="404" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="418" text-anchor="middle">«Guest»</text>
<text class="nm" x="500.5" y="434" text-anchor="middle">Open-GuestSession()</text>
<line class="div" x1="335" y1="441" x2="640" y2="441"/>
<g class="sn"><circle cx="351" cy="425" r="10"/><text x="351" y="429" text-anchor="middle">3</text></g>
<text class="at" x="345" y="456">called by Get-LicenseReport</text>
<text class="at" x="345" y="473">starts the VM if it is off and waits for</text>
<text class="at" x="345" y="490">it</text>
</g>
<g class="bx-store"><rect x="20" y="404" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="418" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="434" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="441" x2="275" y2="441"/>
<text class="at" x="30" y="456">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="30" y="473">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="404" width="270" height="84" rx="3"/>
<text class="st" x="875" y="418" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="434" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="441" x2="1010" y2="441"/>
<text class="at" x="750" y="456">running, reachable</text>
</g>
<g class="bx-mod"><rect x="335" y="533" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="547" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="563" text-anchor="middle">Get-GuestLicenseStatus()</text>
<line class="div" x1="335" y1="570" x2="640" y2="570"/>
<g class="sn"><circle cx="351" cy="554" r="10"/><text x="351" y="558" text-anchor="middle">4</text></g>
<text class="at" x="345" y="585">called by Get-LicenseReport</text>
<text class="at" x="345" y="602">days left, rearms left</text>
</g>
<g class="bx-store"><rect x="20" y="533" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="547" text-anchor="middle">«guest»</text>
<text class="nm" x="147.5" y="563" text-anchor="middle">Running guest</text>
<line class="div" x1="20" y1="570" x2="275" y2="570"/>
<text class="at" x="30" y="585">SoftwareLicensingProduct</text>
</g>
<g class="bx-mod"><rect x="335" y="645" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="659" text-anchor="middle">«Capture»</text>
<text class="nm" x="500.5" y="675" text-anchor="middle">Get-CaptureManifest()</text>
<line class="div" x1="335" y1="682" x2="640" y2="682"/>
<g class="sn"><circle cx="351" cy="666" r="10"/><text x="351" y="670" text-anchor="middle">5</text></g>
<text class="at" x="345" y="697">called by Get-LicenseReport</text>
<text class="at" x="345" y="714">when the last capture was taken, and its</text>
<text class="at" x="345" y="731">databases</text>
</g>
<g class="bx-store"><rect x="20" y="645" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="659" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="675" text-anchor="middle">&lt;VM&gt;\State\</text>
<line class="div" x1="20" y1="682" x2="275" y2="682"/>
<text class="at" x="30" y="697">manifest.json</text>
</g>
<g class="bx-mod"><rect x="335" y="774" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="788" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="804" text-anchor="middle">Get-MaintenanceDecision()</text>
<line class="div" x1="335" y1="811" x2="640" y2="811"/>
<g class="sn"><circle cx="351" cy="795" r="10"/><text x="351" y="799" text-anchor="middle">6</text></g>
<text class="at" x="345" y="826">called by Get-LicenseReport</text>
<text class="at" x="345" y="843">none, rearm or rebuild</text>
</g>
<g class="bx-store"><rect x="740" y="774" width="270" height="118" rx="3"/>
<text class="st" x="875" y="788" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="804" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="811" x2="1010" y2="811"/>
<text class="at" x="750" y="826">LazyVM.License: days</text>
<text class="at" x="750" y="843">rearms,</text>
<text class="at" x="750" y="860">last capture</text>
<text class="at" x="750" y="877">next action</text>
</g>
</svg>
