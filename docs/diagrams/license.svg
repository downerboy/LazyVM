<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 766" width="1030" height="766" role="img" aria-labelledby="t-license">
<title id="t-license">Check the license: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="766"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,67.5 L305,67.5 L305,672"/>
<path class="cl" d="M305,149 L335,149" marker-end="url(#ac)"/>
<path class="cl" d="M305,291 L335,291" marker-end="url(#ac)"/>
<path class="cl" d="M305,382 L335,382" marker-end="url(#ac)"/>
<path class="cl" d="M305,490 L335,490" marker-end="url(#ac)"/>
<path class="cl" d="M305,581 L335,581" marker-end="url(#ac)"/>
<path class="cl" d="M305,672 L335,672" marker-end="url(#ac)"/>
<path class="df" d="M275,188.0 L335,188.0" marker-end="url(#ad)"/>
<path class="df" d="M640,162.5 L740,162.5" marker-end="url(#ad)"/>
<path class="df" d="M275,404.0 L335,404.0" marker-end="url(#ad)"/>
<path class="df" d="M640,395.5 L740,395.5" marker-end="url(#ad)"/>
<path class="df" d="M275,503.5 L335,503.5" marker-end="url(#ad)"/>
<path class="df" d="M275,594.5 L335,594.5" marker-end="url(#ad)"/>
<path class="df" d="M640,694.0 L740,694.0" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188.0" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690.0" cy="162.5" r="10"/><text x="690.0" y="166.0" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="404.0" r="10"/><text x="293" y="407.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690.0" cy="395.5" r="10"/><text x="690.0" y="399.0" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="503.5" r="10"/><text x="293" y="507.0" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="594.5" r="10"/><text x="293" y="598.0" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690.0" cy="694.0" r="10"/><text x="690.0" y="697.5" text-anchor="middle">D7</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Get-LazyVMLicense</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="129" width="305" height="118" rx="3"/>
<text class="st" x="487.5" y="143" text-anchor="middle">«Common»</text>
<text class="nm" x="487.5" y="159" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="166" x2="640" y2="166"/>
<g class="sn"><circle cx="351" cy="150" r="10"/><text x="351" y="154" text-anchor="middle">1</text></g>
<text class="at" x="345" y="181">builds the VM context</text>
<text class="at" x="345" y="198">and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="129" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="143" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="159" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="166" x2="275" y2="166"/>
<text class="at" x="30" y="181">HKLM:\SOFTWARE\LazyVM  Root</text>
<text class="at" x="30" y="198">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="215">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="232">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="129" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="143" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="159" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="166" x2="1010" y2="166"/>
<text class="at" x="750" y="181">&lt;VM&gt;.log  (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="271" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="285" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="487.5" y="301" text-anchor="middle">Get-LicenseReport()</text>
<line class="div" x1="335" y1="308" x2="640" y2="308"/>
<g class="sn"><circle cx="351" cy="292" r="10"/><text x="351" y="296" text-anchor="middle">2</text></g>
<text class="at" x="345" y="323">steps 3-6 are its calls</text>
</g>
<g class="bx-mod"><rect x="335" y="362" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="376" text-anchor="middle">«Guest, called by Get-LicenseReport»</text>
<text class="nm" x="487.5" y="392" text-anchor="middle">Connect-Guest()</text>
<line class="div" x1="335" y1="399" x2="640" y2="399"/>
<g class="sn"><circle cx="351" cy="383" r="10"/><text x="351" y="387" text-anchor="middle">3</text></g>
<text class="at" x="345" y="414">starts the VM first if off</text>
</g>
<g class="bx-store"><rect x="20" y="362" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="376" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="392" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="399" x2="275" y2="399"/>
<text class="at" x="30" y="414">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="30" y="431">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="362" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="376" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875.0" y="392" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="399" x2="1010" y2="399"/>
<text class="at" x="750" y="414">running, reachable</text>
</g>
<g class="bx-mod"><rect x="335" y="470" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="484" text-anchor="middle">«Maintenance, called by Get-LicenseReport»</text>
<text class="nm" x="487.5" y="500" text-anchor="middle">Get-GuestLicenseStatus()</text>
<line class="div" x1="335" y1="507" x2="640" y2="507"/>
<g class="sn"><circle cx="351" cy="491" r="10"/><text x="351" y="495" text-anchor="middle">4</text></g>
</g>
<g class="bx-store"><rect x="20" y="470" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="484" text-anchor="middle">«guest»</text>
<text class="nm" x="147.5" y="500" text-anchor="middle">Running guest</text>
<line class="div" x1="20" y1="507" x2="275" y2="507"/>
<text class="at" x="30" y="522">SoftwareLicensingProduct</text>
</g>
<g class="bx-mod"><rect x="335" y="561" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="575" text-anchor="middle">«Capture, called by Get-LicenseReport»</text>
<text class="nm" x="487.5" y="591" text-anchor="middle">Get-CaptureManifest()</text>
<line class="div" x1="335" y1="598" x2="640" y2="598"/>
<g class="sn"><circle cx="351" cy="582" r="10"/><text x="351" y="586" text-anchor="middle">5</text></g>
</g>
<g class="bx-store"><rect x="20" y="561" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="575" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="591" text-anchor="middle">&lt;VM&gt;\State\</text>
<line class="div" x1="20" y1="598" x2="275" y2="598"/>
<text class="at" x="30" y="613">manifest.json</text>
</g>
<g class="bx-mod"><rect x="335" y="652" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="666" text-anchor="middle">«Maintenance, called by Get-LicenseReport»</text>
<text class="nm" x="487.5" y="682" text-anchor="middle">Get-MaintenanceDecision()</text>
<line class="div" x1="335" y1="689" x2="640" y2="689"/>
<g class="sn"><circle cx="351" cy="673" r="10"/><text x="351" y="677" text-anchor="middle">6</text></g>
<text class="at" x="345" y="704">none, rearm or rebuild</text>
</g>
<g class="bx-store"><rect x="740" y="652" width="270" height="84" rx="3"/>
<text class="st" x="875.0" y="666" text-anchor="middle">«output»</text>
<text class="nm" x="875.0" y="682" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="689" x2="1010" y2="689"/>
<text class="at" x="750" y="704">LazyVM.License: days, rearms,</text>
<text class="at" x="750" y="721">last capture, next action</text>
</g>
</svg>
