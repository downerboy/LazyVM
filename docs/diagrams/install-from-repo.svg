<text class="st" x="147.5" y="721" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="737" text-anchor="middle">out\LazyVM\</text>
<line class="div" x1="20" y1="744" x2="275" y2="744"/>
<text class="at" x="30" y="759">&lt;version&gt;\</text>
</g>
<g class="bx-store"><rect x="740" y="707" width="270" height="84" rx="3"/>
