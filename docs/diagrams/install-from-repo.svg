<g class="bx-caller"><rect x="20" y="34" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="48" text-anchor="middle">«double-click»</text>
<text class="nm" x="147.5" y="64" text-anchor="middle">Install-FromRepository.cmd</text>
<line class="div" x1="20" y1="71" x2="275" y2="71"/>
<text class="at" x="30" y="86">asks for administrator rights</text>
</g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">./Invoke-AnalyzerAndTest.ps1</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">&amp;&amp; ./src/Install.ps1 -Path out</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«build\Assemble.ps1»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Invoke-Assemble()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">merges Public\ and Private\ into one</text>
<text class="at" x="345" y="215">.psm1, then imports it to check the</text>
<text class="at" x="345" y="232">exports</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">src\LazyVM\</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">Public\ Private\ Data\</text>
<text class="at" x="30" y="215">LazyVM.psd1</text>
</g>
<g class="bx-store"><rect x="740" y="146" width="270" height="84" rx="3"/>
<text class="st" x="875" y="160" text-anchor="middle">«folder»</text>
<text class="nm" x="875" y="176" text-anchor="middle">out\LazyVM\</text>
<line class="div" x1="740" y1="183" x2="1010" y2="183"/>
<text class="at" x="750" y="198">&lt;version&gt;\</text>
</g>
<g class="bx-mod"><rect x="335" y="275" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="289" text-anchor="middle">«build\Tools.ps1»</text>
<text class="nm" x="500.5" y="305" text-anchor="middle">Install-BuildTool()</text>
<line class="div" x1="335" y1="312" x2="640" y2="312"/>
<g class="sn"><circle cx="351" cy="296" r="10"/><text x="351" y="300" text-anchor="middle">2</text></g>
<text class="at" x="345" y="327">installs the pinned version when it is</text>
<text class="at" x="345" y="344">missing; other versions are left alone</text>
</g>
<g class="bx-store"><rect x="20" y="275" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="289" text-anchor="middle">«web»</text>
<text class="nm" x="147.5" y="305" text-anchor="middle">PowerShell Gallery</text>
<line class="div" x1="20" y1="312" x2="275" y2="312"/>
<text class="at" x="30" y="327">PSScriptAnalyzer 1.24.0</text>
<text class="at" x="30" y="344">Pester 5.7.1</text>
</g>
<g class="bx-store"><rect x="740" y="275" width="270" height="84" rx="3"/>
<text class="st" x="875" y="289" text-anchor="middle">«folder»</text>
<text class="nm" x="875" y="305" text-anchor="middle">CurrentUser modules</text>
<line class="div" x1="740" y1="312" x2="1010" y2="312"/>
<text class="at" x="750" y="327">PSScriptAnalyzer</text>
<text class="at" x="750" y="344">Pester</text>
</g>
<g class="bx-mod"><rect x="335" y="387" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="401" text-anchor="middle">«build\Analyze.ps1»</text>
<text class="nm" x="500.5" y="417" text-anchor="middle">Invoke-Analyze()</text>
<line class="div" x1="335" y1="424" x2="640" y2="424"/>
<g class="sn"><circle cx="351" cy="408" r="10"/><text x="351" y="412" text-anchor="middle">3</text></g>
<text class="at" x="345" y="439">in a job of its own; any finding stops</text>
<text class="at" x="345" y="456">here</text>
</g>
<g class="bx-store"><rect x="20" y="387" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="401" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="417" text-anchor="middle">Repo</text>
<line class="div" x1="20" y1="424" x2="275" y2="424"/>
<text class="at" x="30" y="439">src\ tests\</text>
<text class="at" x="30" y="456">PSScriptAnalyzerSettings.psd1</text>
</g>
<g class="bx-mod"><rect x="335" y="499" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="513" text-anchor="middle">«build\Test.ps1»</text>
<text class="nm" x="500.5" y="529" text-anchor="middle">Invoke-Test()</text>
<line class="div" x1="335" y1="536" x2="640" y2="536"/>
<g class="sn"><circle cx="351" cy="520" r="10"/><text x="351" y="524" text-anchor="middle">4</text></g>
<text class="at" x="345" y="551">any failure stops here</text>
</g>
<g class="bx-store"><rect x="20" y="499" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="513" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="529" text-anchor="middle">Repo</text>
<line class="div" x1="20" y1="536" x2="275" y2="536"/>
<text class="at" x="30" y="551">tests\*.Tests.ps1</text>
</g>
<g class="bx-store"><rect x="20" y="595" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="609" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="625" text-anchor="middle">out\LazyVM\</text>
<line class="div" x1="20" y1="632" x2="275" y2="632"/>
<text class="at" x="30" y="647">&lt;version&gt;\</text>
</g>
<g class="bx-store"><rect x="740" y="499" width="270" height="84" rx="3"/>
