<text class="nm" x="875" y="529" text-anchor="middle">out\</text>
<line class="div" x1="740" y1="536" x2="1010" y2="536"/>
<text class="at" x="750" y="551">testResults.xml</text>
</g>
<g class="bx-mod"><rect x="335" y="707" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="721" text-anchor="middle">«script»</text>
<text class="nm" x="500.5" y="737" text-anchor="middle">Install.ps1 -Path out</text>
<line class="div" x1="335" y1="744" x2="640" y2="744"/>
<g class="sn"><circle cx="351" cy="728" r="10"/><text x="351" y="732" text-anchor="middle">5</text></g>
<text class="at" x="345" y="759">only when every check passed: copies the</text>
<text class="at" x="345" y="776">newest built version and unblocks it</text>
