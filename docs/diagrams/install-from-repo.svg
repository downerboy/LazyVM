<text class="nm" x="875" y="737" text-anchor="middle">$env:ProgramFiles\PowerShell\</text>
<line class="div" x1="740" y1="744" x2="1010" y2="744"/>
<text class="at" x="750" y="759">Modules\LazyVM\&lt;version&gt;\</text>
</g>
