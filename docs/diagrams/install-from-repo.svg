<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 709" width="1030" height="709" role="img" aria-labelledby="t-install-from-repo">
<title id="t-install-from-repo">Install from the repository: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="709"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,84.5 L305,84.5 L305,615"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="cl" d="M305,308 L335,308" marker-end="url(#ac)"/>
<path class="cl" d="M305,416 L335,416" marker-end="url(#ac)"/>
<path class="cl" d="M305,524 L335,524" marker-end="url(#ac)"/>
<path class="cl" d="M305,615 L335,615" marker-end="url(#ac)"/>
<path class="df" d="M275,205.0 L335,205.0" marker-end="url(#ad)"/>
<path class="df" d="M640,196.5 L740,196.5" marker-end="url(#ad)"/>
<path class="df" d="M275,330.0 L335,330.0" marker-end="url(#ad)"/>
<path class="df" d="M640,321.5 L740,321.5" marker-end="url(#ad)"/>
<path class="df" d="M275,438.0 L335,438.0" marker-end="url(#ad)"/>
<path class="df" d="M275,537.5 L335,537.5" marker-end="url(#ad)"/>
<path class="df" d="M640,537.5 L740,537.5" marker-end="url(#ad)"/>
<path class="df" d="M275,628.5 L335,628.5" marker-end="url(#ad)"/>
<path class="df" d="M640,637.0 L740,637.0" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="205.0" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690.0" cy="196.5" r="10"/><text x="690.0" y="200.0" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="330.0" r="10"/><text x="293" y="333.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690.0" cy="321.5" r="10"/><text x="690.0" y="325.0" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="438.0" r="10"/><text x="293" y="441.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="537.5" r="10"/><text x="293" y="541.0" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690.0" cy="537.5" r="10"/><text x="690.0" y="541.0" text-anchor="middle">D7</text></g>
<g class="bd"><circle cx="293" cy="628.5" r="10"/><text x="293" y="632.0" text-anchor="middle">D8</text></g>
<g class="bd"><circle cx="690.0" cy="637.0" r="10"/><text x="690.0" y="640.5" text-anchor="middle">D9</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«script»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">./build.ps1 -Task Install</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Bootstrap  (first time)</text>
<text class="at" x="345" y="103">in the repo folder</text>
<text class="at" x="345" y="120">PowerShell 7, as administrator</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="177" text-anchor="middle">«build.ps1»</text>
<text class="nm" x="487.5" y="193" text-anchor="middle">Invoke-Build()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">merges Public\ and Private\</text>
<text class="at" x="345" y="232">into one .psm1, then imports</text>
<text class="at" x="345" y="249">it to check the exports</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">src\LazyVM\</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">Public\  Private\  Data\</text>
<text class="at" x="30" y="232">LazyVM.psd1</text>
</g>
<g class="bx-store"><rect x="740" y="163" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="177" text-anchor="middle">«folder»</text>
<text class="nm" x="875.0" y="193" text-anchor="middle">out\LazyVM\</text>
<line class="div" x1="740" y1="200" x2="1010" y2="200"/>
<text class="at" x="750" y="215">&lt;version&gt;\</text>
</g>
<g class="bx-mod"><rect x="335" y="288" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="302" text-anchor="middle">«build.ps1»</text>
<text class="nm" x="487.5" y="318" text-anchor="middle">Import-BuildTool()</text>
<line class="div" x1="335" y1="325" x2="640" y2="325"/>
<g class="sn"><circle cx="351" cy="309" r="10"/><text x="351" y="313" text-anchor="middle">2</text></g>
<text class="at" x="345" y="340">missing and no -Bootstrap:</text>
<text class="at" x="345" y="357">stops with a message</text>
</g>
<g class="bx-store"><rect x="20" y="288" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="302" text-anchor="middle">«web»</text>
<text class="nm" x="147.5" y="318" text-anchor="middle">PowerShell Gallery</text>
<line class="div" x1="20" y1="325" x2="275" y2="325"/>
<text class="at" x="30" y="340">PSScriptAnalyzer 1.24.0</text>
<text class="at" x="30" y="357">Pester 5.7.1</text>
</g>
<g class="bx-store"><rect x="740" y="288" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="302" text-anchor="middle">«folder»</text>
<text class="nm" x="875.0" y="318" text-anchor="middle">CurrentUser modules</text>
<line class="div" x1="740" y1="325" x2="1010" y2="325"/>
<text class="at" x="750" y="340">PSScriptAnalyzer, Pester</text>
</g>
<g class="bx-mod"><rect x="335" y="396" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="410" text-anchor="middle">«build.ps1»</text>
<text class="nm" x="487.5" y="426" text-anchor="middle">Invoke-Analyze()</text>
<line class="div" x1="335" y1="433" x2="640" y2="433"/>
<g class="sn"><circle cx="351" cy="417" r="10"/><text x="351" y="421" text-anchor="middle">3</text></g>
<text class="at" x="345" y="448">in a job of its own;</text>
<text class="at" x="345" y="465">any finding stops here</text>
</g>
<g class="bx-store"><rect x="20" y="396" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="410" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="426" text-anchor="middle">Repo</text>
<line class="div" x1="20" y1="433" x2="275" y2="433"/>
<text class="at" x="30" y="448">src\  tests\</text>
<text class="at" x="30" y="465">PSScriptAnalyzerSettings.psd1</text>
</g>
<g class="bx-mod"><rect x="335" y="504" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="518" text-anchor="middle">«build.ps1»</text>
<text class="nm" x="487.5" y="534" text-anchor="middle">Invoke-Test()</text>
<line class="div" x1="335" y1="541" x2="640" y2="541"/>
<g class="sn"><circle cx="351" cy="525" r="10"/><text x="351" y="529" text-anchor="middle">4</text></g>
<text class="at" x="345" y="556">any failure stops here</text>
</g>
<g class="bx-store"><rect x="20" y="504" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="518" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="534" text-anchor="middle">Repo</text>
<line class="div" x1="20" y1="541" x2="275" y2="541"/>
<text class="at" x="30" y="556">tests\*.Tests.ps1</text>
</g>
<g class="bx-store"><rect x="740" y="504" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="518" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="534" text-anchor="middle">out\</text>
<line class="div" x1="740" y1="541" x2="1010" y2="541"/>
<text class="at" x="750" y="556">testResults.xml</text>
</g>
<g class="bx-mod"><rect x="335" y="595" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="609" text-anchor="middle">«build.ps1»</text>
<text class="nm" x="487.5" y="625" text-anchor="middle">Install-BuiltModule()</text>
<line class="div" x1="335" y1="632" x2="640" y2="632"/>
<g class="sn"><circle cx="351" cy="616" r="10"/><text x="351" y="620" text-anchor="middle">5</text></g>
<text class="at" x="345" y="647">replaces the same version,</text>
<text class="at" x="345" y="664">leaves other versions</text>
</g>
<g class="bx-store"><rect x="20" y="595" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="609" text-anchor="middle">«folder»</text>
<text class="nm" x="147.5" y="625" text-anchor="middle">out\LazyVM\</text>
<line class="div" x1="20" y1="632" x2="275" y2="632"/>
<text class="at" x="30" y="647">&lt;version&gt;\</text>
</g>
<g class="bx-store"><rect x="740" y="595" width="270" height="84" rx="3"/>
<text class="st" x="875.0" y="609" text-anchor="middle">«folder»</text>
<text class="nm" x="875.0" y="625" text-anchor="middle">$env:ProgramFiles\PowerShell\</text>
<line class="div" x1="740" y1="632" x2="1010" y2="632"/>
<text class="at" x="750" y="647">Modules\LazyVM\</text>
<text class="at" x="750" y="664">  &lt;version&gt;\</text>
</g>
</svg>
