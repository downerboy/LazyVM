<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1337" width="1030" height="1337" role="img" aria-labelledby="t-dashboard">
<title id="t-dashboard">See the dashboard data: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="1337"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,1226"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,188 L335,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,278 L335,278" marker-end="url(#ac)"/>
<path class="df" d="M275,300 L335,300" marker-end="url(#ad)"/>
<path class="cl" d="M305,390 L335,390" marker-end="url(#ac)"/>
<path class="cl" d="M305,502 L335,502" marker-end="url(#ac)"/>
<path class="df" d="M275,524 L335,524" marker-end="url(#ad)"/>
<path class="cl" d="M305,631 L335,631" marker-end="url(#ac)"/>
<path class="df" d="M275,653 L335,653" marker-end="url(#ad)"/>
<path class="cl" d="M305,777 L335,777" marker-end="url(#ac)"/>
<path class="df" d="M275,799 L335,799" marker-end="url(#ad)"/>
<path class="cl" d="M305,889 L335,889" marker-end="url(#ac)"/>
<path class="df" d="M275,911 L335,911" marker-end="url(#ad)"/>
<path class="cl" d="M305,1018 L335,1018" marker-end="url(#ac)"/>
<path class="df" d="M275,1040 L335,1040" marker-end="url(#ad)"/>
<path class="df" d="M275,1136 L335,1136" marker-end="url(#ad)"/>
<path class="cl" d="M305,1226 L335,1226" marker-end="url(#ac)"/>
<path class="df" d="M275,1248 L335,1248" marker-end="url(#ad)"/>
<path class="df" d="M640,1248 L740,1248" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="300" r="10"/><text x="293" y="303.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="524" r="10"/><text x="293" y="527.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="653" r="10"/><text x="293" y="656.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="799" r="10"/><text x="293" y="802.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="911" r="10"/><text x="293" y="914.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="293" cy="1040" r="10"/><text x="293" y="1043.5" text-anchor="middle">D7</text></g>
<g class="bd"><circle cx="293" cy="1136" r="10"/><text x="293" y="1139.5" text-anchor="middle">D8</text></g>
<g class="bd"><circle cx="293" cy="1248" r="10"/><text x="293" y="1251.5" text-anchor="middle">D9</text></g>
<g class="bd"><circle cx="690" cy="1248" r="10"/><text x="690" y="1251.5" text-anchor="middle">D10</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Get-LazyVMDashboard</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name (wildcards, default *)</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">the LazyVM folder</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="258" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="272" text-anchor="middle">«command»</text>
<text class="nm" x="500.5" y="288" text-anchor="middle">Get-LazyVM()</text>
<line class="div" x1="335" y1="295" x2="640" y2="295"/>
<g class="sn"><circle cx="351" cy="279" r="10"/><text x="351" y="283" text-anchor="middle">2</text></g>
<text class="at" x="345" y="310">every VM matching -Name, with its state</text>
<text class="at" x="345" y="327">and maintenance task (see List VMs)</text>
</g>
<g class="bx-store"><rect x="20" y="258" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="272" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="288" text-anchor="middle">Get-LazyVM</text>
<line class="div" x1="20" y1="295" x2="275" y2="295"/>
<text class="at" x="30" y="310">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="327">Hyper-V, Task Scheduler</text>
</g>
<g class="bx-mod"><rect x="335" y="370" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="384" text-anchor="middle">«Dashboard»</text>
<text class="nm" x="500.5" y="400" text-anchor="middle">New-DashboardEntry()</text>
<line class="div" x1="335" y1="407" x2="640" y2="407"/>
<g class="sn"><circle cx="351" cy="391" r="10"/><text x="351" y="395" text-anchor="middle">3</text></g>
<text class="at" x="345" y="422">per VM; a part it cannot read goes in</text>
<text class="at" x="345" y="439">Problems</text>
</g>
<g class="bx-mod"><rect x="335" y="482" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="496" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="500.5" y="512" text-anchor="middle">Get-VM()</text>
<line class="div" x1="335" y1="519" x2="640" y2="519"/>
<g class="sn"><circle cx="351" cy="503" r="10"/><text x="351" y="507" text-anchor="middle">4</text></g>
<text class="at" x="345" y="534">called by New-DashboardEntry</text>
<text class="at" x="345" y="551">built VMs only: when created, memory in</text>
<text class="at" x="345" y="568">use</text>
</g>
<g class="bx-store"><rect x="20" y="482" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="496" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="512" text-anchor="middle">Hyper-V</text>
<line class="div" x1="20" y1="519" x2="275" y2="519"/>
<text class="at" x="30" y="534">CreationTime, MemoryAssigned</text>
</g>
<g class="bx-mod"><rect x="335" y="611" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="625" text-anchor="middle">«Dashboard»</text>
<text class="nm" x="500.5" y="641" text-anchor="middle">Get-VMDiskUsage()</text>
<line class="div" x1="335" y1="648" x2="640" y2="648"/>
<g class="sn"><circle cx="351" cy="632" r="10"/><text x="351" y="636" text-anchor="middle">5</text></g>
<text class="at" x="345" y="663">called by New-DashboardEntry</text>
<text class="at" x="345" y="680">built VMs only: each disk, with its</text>
<text class="at" x="345" y="697">checkpoint files (Get-VMHardDiskDrive,</text>
<text class="at" x="345" y="714">Get-VHD)</text>
</g>
<g class="bx-store"><rect x="20" y="611" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="625" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="641" text-anchor="middle">Hyper-V</text>
<line class="div" x1="20" y1="648" x2="275" y2="648"/>
<text class="at" x="30" y="663">attached disks, file and maximum</text>
<text class="at" x="30" y="680">sizes</text>
</g>
<g class="bx-mod"><rect x="335" y="757" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="771" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="787" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="794" x2="640" y2="794"/>
<g class="sn"><circle cx="351" cy="778" r="10"/><text x="351" y="782" text-anchor="middle">6</text></g>
<text class="at" x="345" y="809">called by New-DashboardEntry</text>
<text class="at" x="345" y="826">read-only; when the settings are OK</text>
</g>
<g class="bx-store"><rect x="20" y="757" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="771" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="787" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="794" x2="275" y2="794"/>
<text class="at" x="30" y="809">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="826">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="869" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="883" text-anchor="middle">«Dashboard»</text>
<text class="nm" x="500.5" y="899" text-anchor="middle">Get-MaintenanceRunSummary()</text>
<line class="div" x1="335" y1="906" x2="640" y2="906"/>
<g class="sn"><circle cx="351" cy="890" r="10"/><text x="351" y="894" text-anchor="middle">7</text></g>
<text class="at" x="345" y="921">called by New-DashboardEntry</text>
<text class="at" x="345" y="938">when the task is registered: last run</text>
<text class="at" x="345" y="955">and result (Get-ScheduledTaskInfo)</text>
</g>
<g class="bx-store"><rect x="20" y="869" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="883" text-anchor="middle">«task»</text>
<text class="nm" x="147.5" y="899" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="20" y1="906" x2="275" y2="906"/>
<text class="at" x="30" y="921">LazyVM-Maintain-&lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="998" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="1012" text-anchor="middle">«Dashboard»</text>
<text class="nm" x="500.5" y="1028" text-anchor="middle">Get-SecurityFindingSummary()</text>
<line class="div" x1="335" y1="1035" x2="640" y2="1035"/>
<g class="sn"><circle cx="351" cy="1019" r="10"/><text x="351" y="1023" text-anchor="middle">8</text></g>
<text class="at" x="345" y="1050">called by New-DashboardEntry</text>
<text class="at" x="345" y="1067">last scan, and findings neither approved</text>
<text class="at" x="345" y="1084">nor resolved</text>
</g>
<g class="bx-store"><rect x="20" y="998" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="1012" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="1028" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="20" y1="1035" x2="275" y2="1035"/>
<text class="at" x="30" y="1050">SecurityFindings.json</text>
</g>
<g class="bx-store"><rect x="20" y="1094" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="1108" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="1124" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="20" y1="1131" x2="275" y2="1131"/>
<text class="at" x="30" y="1146">SecurityBaseline.json</text>
</g>
<g class="bx-mod"><rect x="335" y="1206" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="1220" text-anchor="middle">«Dashboard»</text>
<text class="nm" x="500.5" y="1236" text-anchor="middle">Get-VMTemplateSummary()</text>
<line class="div" x1="335" y1="1243" x2="640" y2="1243"/>
<g class="sn"><circle cx="351" cy="1227" r="10"/><text x="351" y="1231" text-anchor="middle">9</text></g>
<text class="at" x="345" y="1258">called by New-DashboardEntry</text>
<text class="at" x="345" y="1275">the configuration first built from, and</text>
<text class="at" x="345" y="1292">the green template</text>
</g>
<g class="bx-store"><rect x="20" y="1206" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="1220" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="1236" text-anchor="middle">Templates</text>
<line class="div" x1="20" y1="1243" x2="275" y2="1243"/>
<text class="at" x="30" y="1258">&lt;VM&gt;\Config\VM.Template.json</text>
<text class="at" x="30" y="1275">Shared\Templates\&lt;VM&gt;-latest.json</text>
</g>
<g class="bx-store"><rect x="740" y="1206" width="270" height="84" rx="3"/>
<text class="st" x="875" y="1220" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="1236" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="1243" x2="1010" y2="1243"/>
<text class="at" x="750" y="1258">LazyVM.Dashboard per VM</text>
</g>
</svg>
