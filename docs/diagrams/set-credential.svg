<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 681" width="1030" height="681" role="img" aria-labelledby="t-set-credential">
<title id="t-set-credential">Store the guest account: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="681"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,570"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="df" d="M275,222 L335,222" marker-end="url(#ad)"/>
<path class="df" d="M640,205 L740,205" marker-end="url(#ad)"/>
<path class="cl" d="M305,329 L335,329" marker-end="url(#ac)"/>
<path class="df" d="M275,351 L335,351" marker-end="url(#ad)"/>
<path class="cl" d="M305,441 L335,441" marker-end="url(#ac)"/>
<path class="df" d="M275,471.5 L335,471.5" marker-end="url(#ad)"/>
<path class="cl" d="M305,570 L335,570" marker-end="url(#ac)"/>
<path class="df" d="M640,600.5 L740,600.5" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="222" r="10"/><text x="293" y="225.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690" cy="205" r="10"/><text x="690" y="208.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="351" r="10"/><text x="293" y="354.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="471.5" r="10"/><text x="293" y="475" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="600.5" r="10"/><text x="690" y="604" text-anchor="middle">D5</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Set-LazyVMCredential</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-Credential (optional)</text>
<text class="at" x="345" y="120">-Force (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="177" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="193" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">builds the VM context and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">HKLM:\SOFTWARE\LazyVM Root</text>
<text class="at" x="30" y="232">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="266">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="163" width="270" height="84" rx="3"/>
<text class="st" x="875" y="177" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="193" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="200" x2="1010" y2="200"/>
<text class="at" x="750" y="215">&lt;VM&gt;.log (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="309" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="323" text-anchor="middle">«Credentials»</text>
<text class="nm" x="500.5" y="339" text-anchor="middle">Get-GuestCredential()</text>
<line class="div" x1="335" y1="346" x2="640" y2="346"/>
<g class="sn"><circle cx="351" cy="330" r="10"/><text x="351" y="334" text-anchor="middle">2</text></g>
<text class="at" x="345" y="361">the stored account, if any: asks before</text>
<text class="at" x="345" y="378">replacing it unless -Force</text>
</g>
<g class="bx-store"><rect x="20" y="309" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="323" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="339" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="346" x2="275" y2="346"/>
<text class="at" x="30" y="361">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="30" y="378">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-mod"><rect x="335" y="421" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="435" text-anchor="middle">«PowerShell»</text>
<text class="nm" x="500.5" y="451" text-anchor="middle">Get-Credential()</text>
<line class="div" x1="335" y1="458" x2="640" y2="458"/>
<g class="sn"><circle cx="351" cy="442" r="10"/><text x="351" y="446" text-anchor="middle">3</text></g>
<text class="at" x="345" y="473">prompt, if -Credential was not given</text>
</g>
<g class="bx-store"><rect x="20" y="421" width="255" height="101" rx="3"/>
<text class="st" x="147.5" y="435" text-anchor="middle">«user»</text>
<text class="nm" x="147.5" y="451" text-anchor="middle">You</text>
<line class="div" x1="20" y1="458" x2="275" y2="458"/>
<text class="at" x="30" y="473">user name</text>
<text class="at" x="30" y="490">password</text>
<text class="at" x="30" y="507">(empty = generate one)</text>
</g>
<g class="bx-mod"><rect x="335" y="550" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="564" text-anchor="middle">«Credentials»</text>
<text class="nm" x="500.5" y="580" text-anchor="middle">Set-StoredGuestCredential()</text>
<line class="div" x1="335" y1="587" x2="640" y2="587"/>
<g class="sn"><circle cx="351" cy="571" r="10"/><text x="351" y="575" text-anchor="middle">4</text></g>
<text class="at" x="345" y="602">local accounts only;</text>
<text class="at" x="345" y="619">Save-StoredCredential encrypts with the</text>
<text class="at" x="345" y="636">key</text>
</g>
<g class="bx-store"><rect x="740" y="550" width="270" height="101" rx="3"/>
<text class="st" x="875" y="564" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="580" text-anchor="middle">Credential store</text>
<line class="div" x1="740" y1="587" x2="1010" y2="587"/>
<text class="at" x="750" y="602">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="750" y="619">(once; SYSTEM + Administrators)</text>
<text class="at" x="750" y="636">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
</svg>
