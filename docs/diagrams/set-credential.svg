<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 635" width="1030" height="635" role="img" aria-labelledby="t-set-credential">
<title id="t-set-credential">Store the guest account: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="635"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76.0 L305,76.0 L305,524"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="cl" d="M305,308 L335,308" marker-end="url(#ac)"/>
<path class="cl" d="M305,416 L335,416" marker-end="url(#ac)"/>
<path class="cl" d="M305,524 L335,524" marker-end="url(#ac)"/>
<path class="df" d="M275,205.0 L335,205.0" marker-end="url(#ad)"/>
<path class="df" d="M640,179.5 L740,179.5" marker-end="url(#ad)"/>
<path class="df" d="M275,330.0 L335,330.0" marker-end="url(#ad)"/>
<path class="df" d="M275,438.0 L335,438.0" marker-end="url(#ad)"/>
<path class="df" d="M640,554.5 L740,554.5" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="205.0" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690.0" cy="179.5" r="10"/><text x="690.0" y="183.0" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="330.0" r="10"/><text x="293" y="333.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="438.0" r="10"/><text x="293" y="441.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690.0" cy="554.5" r="10"/><text x="690.0" y="558.0" text-anchor="middle">D5</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Set-LazyVMCredential</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-Credential  (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="118" rx="3"/>
<text class="st" x="487.5" y="160" text-anchor="middle">«Common»</text>
<text class="nm" x="487.5" y="176" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">builds the VM context</text>
<text class="at" x="345" y="215">and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">HKLM:\SOFTWARE\LazyVM  Root</text>
<text class="at" x="30" y="215">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="232">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="146" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="160" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="176" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="183" x2="1010" y2="183"/>
<text class="at" x="750" y="198">&lt;VM&gt;.log  (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="288" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="302" text-anchor="middle">«Credentials»</text>
<text class="nm" x="487.5" y="318" text-anchor="middle">Get-StoredCredential()</text>
<line class="div" x1="335" y1="325" x2="640" y2="325"/>
<g class="sn"><circle cx="351" cy="309" r="10"/><text x="351" y="313" text-anchor="middle">2</text></g>
<text class="at" x="345" y="340">asks before replacing</text>
<text class="at" x="345" y="357">unless -Force</text>
</g>
<g class="bx-store"><rect x="20" y="288" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="302" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="318" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="325" x2="275" y2="325"/>
<text class="at" x="30" y="340">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="30" y="357">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-mod"><rect x="335" y="396" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="410" text-anchor="middle">«PowerShell»</text>
<text class="nm" x="487.5" y="426" text-anchor="middle">Get-Credential()</text>
<line class="div" x1="335" y1="433" x2="640" y2="433"/>
<g class="sn"><circle cx="351" cy="417" r="10"/><text x="351" y="421" text-anchor="middle">3</text></g>
<text class="at" x="345" y="448">prompt, if -Credential</text>
<text class="at" x="345" y="465">was not given</text>
</g>
<g class="bx-store"><rect x="20" y="396" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="410" text-anchor="middle">«user»</text>
<text class="nm" x="147.5" y="426" text-anchor="middle">You</text>
<line class="div" x1="20" y1="433" x2="275" y2="433"/>
<text class="at" x="30" y="448">user name, password</text>
<text class="at" x="30" y="465">(empty = generate one)</text>
</g>
<g class="bx-mod"><rect x="335" y="504" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="518" text-anchor="middle">«Credentials»</text>
<text class="nm" x="487.5" y="534" text-anchor="middle">Set-StoredGuestCredential()</text>
<line class="div" x1="335" y1="541" x2="640" y2="541"/>
<g class="sn"><circle cx="351" cy="525" r="10"/><text x="351" y="529" text-anchor="middle">4</text></g>
<text class="at" x="345" y="556">local accounts only;</text>
<text class="at" x="345" y="573">Save-StoredCredential</text>
<text class="at" x="345" y="590">encrypts with the key</text>
</g>
<g class="bx-store"><rect x="740" y="504" width="270" height="101" rx="3"/>
<text class="st" x="875.0" y="518" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="534" text-anchor="middle">Credential store</text>
<line class="div" x1="740" y1="541" x2="1010" y2="541"/>
<text class="at" x="750" y="556">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="750" y="573">  (once; SYSTEM + Administrators)</text>
<text class="at" x="750" y="590">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
</svg>
