<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 789" width="1030" height="789" role="img" aria-labelledby="t-new-profile">
<title id="t-new-profile">Create a VM profile without building: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="789"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,695"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="df" d="M275,205 L335,205" marker-end="url(#ad)"/>
<path class="cl" d="M305,295 L335,295" marker-end="url(#ac)"/>
<path class="df" d="M275,317 L335,317" marker-end="url(#ad)"/>
<path class="df" d="M275,413 L335,413" marker-end="url(#ad)"/>
<path class="df" d="M275,509 L335,509" marker-end="url(#ad)"/>
<path class="df" d="M275,605 L335,605" marker-end="url(#ad)"/>
<path class="df" d="M640,317 L740,317" marker-end="url(#ad)"/>
<path class="df" d="M640,413 L740,413" marker-end="url(#ad)"/>
<path class="cl" d="M305,695 L335,695" marker-end="url(#ac)"/>
<g class="bd"><circle cx="293" cy="205" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="317" r="10"/><text x="293" y="320.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="413" r="10"/><text x="293" y="416.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="509" r="10"/><text x="293" y="512.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="605" r="10"/><text x="293" y="608.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="317" r="10"/><text x="690" y="320.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="413" r="10"/><text x="690" y="416.5" text-anchor="middle">D7</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">New-LazyVM</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-From &lt;OtherVM&gt; | -ConfigTemplate</text>
<text class="at" x="345" y="120">&lt;Template&gt; (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="177" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="193" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">the LazyVM folder; stops if none has</text>
<text class="at" x="345" y="232">been chosen yet</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">HKLM:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="275" width="305" height="372" rx="3"/>
<text class="st" x="500.5" y="289" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="305" text-anchor="middle">New-VMProfile()</text>
<line class="div" x1="335" y1="312" x2="640" y2="312"/>
<g class="sn"><circle cx="351" cy="296" r="10"/><text x="351" y="300" text-anchor="middle">2</text></g>
<text class="at" x="345" y="327">applies -ConfigTemplate&apos;s Settings, or</text>
<text class="at" x="345" y="344">copies -From settings except paths,</text>
<text class="at" x="345" y="361">computer name, maintenance time and disk</text>
<text class="at" x="345" y="378">identity; schedules maintenance an hour</text>
<text class="at" x="345" y="395">after the latest existing VM</text>
</g>
<g class="bx-store"><rect x="20" y="275" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="289" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="305" text-anchor="middle">&lt;OtherVM&gt;\Config\</text>
<line class="div" x1="20" y1="312" x2="275" y2="312"/>
<text class="at" x="30" y="327">VM.json</text>
</g>
<g class="bx-store"><rect x="20" y="371" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="385" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="401" text-anchor="middle">Config templates</text>
<line class="div" x1="20" y1="408" x2="275" y2="408"/>
<text class="at" x="30" y="423">Data\Templates\*.json</text>
<text class="at" x="30" y="440">Shared\Templates\*.json</text>
</g>
<g class="bx-store"><rect x="20" y="467" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="481" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="497" text-anchor="middle">Shared\Config\</text>
<line class="div" x1="20" y1="504" x2="275" y2="504"/>
<text class="at" x="30" y="519">LazyVM.Settings.json</text>
</g>
<g class="bx-store"><rect x="20" y="563" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="577" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="593" text-anchor="middle">*\Config\</text>
<line class="div" x1="20" y1="600" x2="275" y2="600"/>
<text class="at" x="30" y="615">VM.json</text>
</g>
<g class="bx-store"><rect x="740" y="275" width="270" height="84" rx="3"/>
<text class="st" x="875" y="289" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="305" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="740" y1="312" x2="1010" y2="312"/>
<text class="at" x="750" y="327">VM.json</text>
</g>
<g class="bx-store"><rect x="740" y="371" width="270" height="84" rx="3"/>
<text class="st" x="875" y="385" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="401" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="740" y1="408" x2="1010" y2="408"/>
<text class="at" x="750" y="423">VM.json</text>
<text class="at" x="750" y="440">its Tooling (with -From)</text>
</g>
<g class="bx-mod"><rect x="335" y="675" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="689" text-anchor="middle">«command»</text>
<text class="nm" x="500.5" y="705" text-anchor="middle">Get-LazyVM()</text>
<line class="div" x1="335" y1="712" x2="640" y2="712"/>
<g class="sn"><circle cx="351" cy="696" r="10"/><text x="351" y="700" text-anchor="middle">3</text></g>
<text class="at" x="345" y="727">returns the new VM as LazyVM.VM</text>
</g>
</svg>
