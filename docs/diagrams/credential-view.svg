<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 630" width="1030" height="630" role="img" aria-labelledby="t-credential-view">
<title id="t-credential-view">See the guest account: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="630"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,536"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="df" d="M275,205 L335,205" marker-end="url(#ad)"/>
<path class="cl" d="M305,295 L335,295" marker-end="url(#ac)"/>
<path class="df" d="M275,317 L335,317" marker-end="url(#ad)"/>
<path class="df" d="M640,325.5 L740,325.5" marker-end="url(#ad)"/>
<path class="cl" d="M305,424 L335,424" marker-end="url(#ac)"/>
<path class="df" d="M275,446 L335,446" marker-end="url(#ad)"/>
<path class="df" d="M640,446 L740,446" marker-end="url(#ad)"/>
<path class="cl" d="M305,536 L335,536" marker-end="url(#ac)"/>
<path class="df" d="M640,558 L740,558" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="205" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="317" r="10"/><text x="293" y="320.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="690" cy="325.5" r="10"/><text x="690" y="329" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="446" r="10"/><text x="293" y="449.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="446" r="10"/><text x="690" y="449.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="558" r="10"/><text x="690" y="561.5" text-anchor="middle">D6</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Get-LazyVMCredential</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-AsPlainText | -ToClipboard |</text>
<text class="at" x="345" y="120">-RecoveryPassword (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="177" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="193" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">finds the key and the credential files</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="232">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="275" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="289" text-anchor="middle">«Credentials»</text>
<text class="nm" x="500.5" y="305" text-anchor="middle">Get-StoredCredential()</text>
<line class="div" x1="335" y1="312" x2="640" y2="312"/>
<g class="sn"><circle cx="351" cy="296" r="10"/><text x="351" y="300" text-anchor="middle">2</text></g>
<text class="at" x="345" y="327">decrypts with the key</text>
</g>
<g class="bx-store"><rect x="20" y="275" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="289" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="305" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="312" x2="275" y2="312"/>
<text class="at" x="30" y="327">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="30" y="344">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="275" width="270" height="101" rx="3"/>
<text class="st" x="875" y="289" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="305" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="312" x2="1010" y2="312"/>
<text class="at" x="750" y="327">PSCredential</text>
<text class="at" x="750" y="344">or user name</text>
<text class="at" x="750" y="361">and password as text</text>
</g>
<g class="bx-mod"><rect x="335" y="404" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="418" text-anchor="middle">«Credentials»</text>
<text class="nm" x="500.5" y="434" text-anchor="middle">Get-StoredSecretTable()</text>
<line class="div" x1="335" y1="441" x2="640" y2="441"/>
<g class="sn"><circle cx="351" cy="425" r="10"/><text x="351" y="429" text-anchor="middle">3</text></g>
<text class="at" x="345" y="456">with -RecoveryPassword, instead: every</text>
<text class="at" x="345" y="473">disk&apos;s BitLocker recovery password</text>
</g>
<g class="bx-store"><rect x="20" y="404" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="418" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="434" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="441" x2="275" y2="441"/>
<text class="at" x="30" y="456">&lt;VM&gt;\Credentials\bitlocker.cred</text>
</g>
<g class="bx-store"><rect x="740" y="404" width="270" height="84" rx="3"/>
<text class="st" x="875" y="418" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="434" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="441" x2="1010" y2="441"/>
<text class="at" x="750" y="456">Disk, DiskGuid, Recorded,</text>
<text class="at" x="750" y="473">RecoveryPassword</text>
</g>
<g class="bx-mod"><rect x="335" y="516" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="530" text-anchor="middle">«Credentials»</text>
<text class="nm" x="500.5" y="546" text-anchor="middle">Set-ClipboardSecret()</text>
<line class="div" x1="335" y1="553" x2="640" y2="553"/>
<g class="sn"><circle cx="351" cy="537" r="10"/><text x="351" y="541" text-anchor="middle">4</text></g>
<text class="at" x="345" y="568">with -ToClipboard: the password, kept</text>
<text class="at" x="345" y="585">out of clipboard history and sync</text>
</g>
<g class="bx-store"><rect x="740" y="516" width="270" height="84" rx="3"/>
<text class="st" x="875" y="530" text-anchor="middle">«host»</text>
<text class="nm" x="875" y="546" text-anchor="middle">Clipboard</text>
<line class="div" x1="740" y1="553" x2="1010" y2="553"/>
<text class="at" x="750" y="568">not in history or sync</text>
</g>
</svg>
