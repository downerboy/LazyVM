<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 871" width="1030" height="871" role="img" aria-labelledby="t-set-root">
<title id="t-set-root">Choose the LazyVM folder: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="871"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,760"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,188 L335,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,295 L335,295" marker-end="url(#ac)"/>
<path class="cl" d="M305,407 L335,407" marker-end="url(#ac)"/>
<path class="df" d="M275,429 L335,429" marker-end="url(#ad)"/>
<path class="cl" d="M305,519 L335,519" marker-end="url(#ac)"/>
<path class="df" d="M640,541 L740,541" marker-end="url(#ad)"/>
<path class="cl" d="M305,648 L335,648" marker-end="url(#ac)"/>
<path class="df" d="M640,670 L740,670" marker-end="url(#ad)"/>
<path class="cl" d="M305,760 L335,760" marker-end="url(#ac)"/>
<path class="df" d="M275,782 L335,782" marker-end="url(#ad)"/>
<path class="df" d="M640,782 L740,782" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="429" r="10"/><text x="293" y="432.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="690" cy="541" r="10"/><text x="690" y="544.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690" cy="670" r="10"/><text x="690" y="673.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="782" r="10"/><text x="293" y="785.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="782" r="10"/><text x="690" y="785.5" text-anchor="middle">D6</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Set-LazyVMRoot</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Path D:\DevVM</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Assert-NoLegacyInstallation()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">stops while a machine-wide install is</text>
<text class="at" x="345" y="215">still there, naming</text>
<text class="at" x="345" y="232">Convert-LazyVMInstallation</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">HKLM:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">Root, if still there</text>
</g>
<g class="bx-mod"><rect x="335" y="275" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="289" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="305" text-anchor="middle">Resolve-SettingsRoot()</text>
<line class="div" x1="335" y1="312" x2="640" y2="312"/>
<g class="sn"><circle cx="351" cy="296" r="10"/><text x="351" y="300" text-anchor="middle">2</text></g>
<text class="at" x="345" y="327">checks it is a full local path</text>
</g>
<g class="bx-mod"><rect x="335" y="387" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="401" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="417" text-anchor="middle">Get-RegisteredRoot()</text>
<line class="div" x1="335" y1="424" x2="640" y2="424"/>
<g class="sn"><circle cx="351" cy="408" r="10"/><text x="351" y="412" text-anchor="middle">3</text></g>
<text class="at" x="345" y="439">warns if a different folder was in use</text>
</g>
<g class="bx-store"><rect x="20" y="387" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="401" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="417" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="424" x2="275" y2="424"/>
<text class="at" x="30" y="439">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="499" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="513" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="529" text-anchor="middle">Initialize-RootFolder()</text>
<line class="div" x1="335" y1="536" x2="640" y2="536"/>
<g class="sn"><circle cx="351" cy="520" r="10"/><text x="351" y="524" text-anchor="middle">4</text></g>
<text class="at" x="345" y="551">creates the folder, or locks it again:</text>
<text class="at" x="345" y="568">full control for you and SYSTEM only,</text>
<text class="at" x="345" y="585">inherited by everything in it</text>
</g>
<g class="bx-store"><rect x="740" y="499" width="270" height="84" rx="3"/>
<text class="st" x="875" y="513" text-anchor="middle">«folder»</text>
<text class="nm" x="875" y="529" text-anchor="middle">D:\DevVM</text>
<line class="div" x1="740" y1="536" x2="1010" y2="536"/>
<text class="at" x="750" y="551">you + SYSTEM</text>
<text class="at" x="750" y="568">nothing inherited</text>
</g>
<g class="bx-mod"><rect x="335" y="628" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="642" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="658" text-anchor="middle">Set-RegisteredRoot()</text>
<line class="div" x1="335" y1="665" x2="640" y2="665"/>
<g class="sn"><circle cx="351" cy="649" r="10"/><text x="351" y="653" text-anchor="middle">5</text></g>
<text class="at" x="345" y="680">records it</text>
</g>
<g class="bx-store"><rect x="740" y="628" width="270" height="84" rx="3"/>
<text class="st" x="875" y="642" text-anchor="middle">«registry»</text>
<text class="nm" x="875" y="658" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="740" y1="665" x2="1010" y2="665"/>
<text class="at" x="750" y="680">Root = D:\DevVM</text>
</g>
<g class="bx-mod"><rect x="335" y="740" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="754" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="770" text-anchor="middle">Initialize-ConfigFolder()</text>
<line class="div" x1="335" y1="777" x2="640" y2="777"/>
<g class="sn"><circle cx="351" cy="761" r="10"/><text x="351" y="765" text-anchor="middle">6</text></g>
<text class="at" x="345" y="792">copies the schema for VS Code</text>
<text class="at" x="345" y="809">autocomplete; returns the folder and its</text>
<text class="at" x="345" y="826">settings file</text>
</g>
<g class="bx-store"><rect x="20" y="740" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="754" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="770" text-anchor="middle">Module Data\</text>
<line class="div" x1="20" y1="777" x2="275" y2="777"/>
<text class="at" x="30" y="792">LazyVM.Settings.schema.json</text>
</g>
<g class="bx-store"><rect x="740" y="740" width="270" height="84" rx="3"/>
<text class="st" x="875" y="754" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="770" text-anchor="middle">D:\DevVM\Shared\Config\</text>
<line class="div" x1="740" y1="777" x2="1010" y2="777"/>
<text class="at" x="750" y="792">LazyVM.Settings.schema.json</text>
<text class="at" x="750" y="809">LazyVM.Settings.json (if new)</text>
</g>
</svg>
