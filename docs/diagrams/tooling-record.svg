<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 755" width="1030" height="755" role="img" aria-labelledby="t-tooling-record">
<title id="t-tooling-record">Record tooling now: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="755"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,67.5 L305,67.5 L305,678"/>
<path class="cl" d="M305,149 L335,149" marker-end="url(#ac)"/>
<path class="cl" d="M305,291 L335,291" marker-end="url(#ac)"/>
<path class="cl" d="M305,399 L335,399" marker-end="url(#ac)"/>
<path class="cl" d="M305,678 L335,678" marker-end="url(#ac)"/>
<path class="df" d="M275,188.0 L335,188.0" marker-end="url(#ad)"/>
<path class="df" d="M640,162.5 L740,162.5" marker-end="url(#ad)"/>
<path class="df" d="M275,313.0 L335,313.0" marker-end="url(#ad)"/>
<path class="df" d="M640,304.5 L740,304.5" marker-end="url(#ad)"/>
<path class="df" d="M275,429.5 L335,429.5" marker-end="url(#ad)"/>
<path class="df" d="M275,523.5 L335,523.5" marker-end="url(#ad)"/>
<path class="df" d="M640,412.5 L740,412.5" marker-end="url(#ad)"/>
<path class="df" d="M640,498.0 L740,498.0" marker-end="url(#ad)"/>
<path class="df" d="M640,592.0 L740,592.0" marker-end="url(#ad)"/>
<path class="df" d="M640,691.5 L740,691.5" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188.0" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690.0" cy="162.5" r="10"/><text x="690.0" y="166.0" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="313.0" r="10"/><text x="293" y="316.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690.0" cy="304.5" r="10"/><text x="690.0" y="308.0" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="429.5" r="10"/><text x="293" y="433.0" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="523.5" r="10"/><text x="293" y="527.0" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690.0" cy="412.5" r="10"/><text x="690.0" y="416.0" text-anchor="middle">D7</text></g>
<g class="bd"><circle cx="690.0" cy="498.0" r="10"/><text x="690.0" y="501.5" text-anchor="middle">D8</text></g>
<g class="bd"><circle cx="690.0" cy="592.0" r="10"/><text x="690.0" y="595.5" text-anchor="middle">D9</text></g>
<g class="bd"><circle cx="690.0" cy="691.5" r="10"/><text x="690.0" y="695.0" text-anchor="middle">D10</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Save-LazyVMTooling</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="129" width="305" height="118" rx="3"/>
<text class="st" x="487.5" y="143" text-anchor="middle">«Common»</text>
<text class="nm" x="487.5" y="159" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="166" x2="640" y2="166"/>
<g class="sn"><circle cx="351" cy="150" r="10"/><text x="351" y="154" text-anchor="middle">1</text></g>
<text class="at" x="345" y="181">loads the settings into $CFG</text>
<text class="at" x="345" y="198">and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="129" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="143" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="159" text-anchor="middle">$CFG sources</text>
<line class="div" x1="20" y1="166" x2="275" y2="166"/>
<text class="at" x="30" y="181">HKLM:\SOFTWARE\LazyVM  Root</text>
<text class="at" x="30" y="198">Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="215">Config\VMs\&lt;VM&gt;\VM.json</text>
<text class="at" x="30" y="232">Backup\&lt;VM&gt;\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="129" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="143" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="159" text-anchor="middle">Logs\</text>
<line class="div" x1="740" y1="166" x2="1010" y2="166"/>
<text class="at" x="750" y="181">&lt;VM&gt;.log  (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="271" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="285" text-anchor="middle">«Tooling»</text>
<text class="nm" x="487.5" y="301" text-anchor="middle">Open-GuestSession()</text>
<line class="div" x1="335" y1="308" x2="640" y2="308"/>
<g class="sn"><circle cx="351" cy="292" r="10"/><text x="351" y="296" text-anchor="middle">2</text></g>
<text class="at" x="345" y="323">starts the VM if it is off,</text>
<text class="at" x="345" y="340">connects with PowerShell Direct</text>
</g>
<g class="bx-store"><rect x="20" y="271" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="285" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="301" text-anchor="middle">Backup\</text>
<line class="div" x1="20" y1="308" x2="275" y2="308"/>
<text class="at" x="30" y="323">.lazyvm.key</text>
<text class="at" x="30" y="340">&lt;VM&gt;\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="271" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="285" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875.0" y="301" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="308" x2="1010" y2="308"/>
<text class="at" x="750" y="323">running</text>
</g>
<g class="bx-mod"><rect x="335" y="379" width="305" height="255" rx="3"/>
<text class="st" x="487.5" y="393" text-anchor="middle">«Tooling»</text>
<text class="nm" x="487.5" y="409" text-anchor="middle">Update-ToolingRecord()</text>
<line class="div" x1="335" y1="416" x2="640" y2="416"/>
<g class="sn"><circle cx="351" cy="400" r="10"/><text x="351" y="404" text-anchor="middle">3</text></g>
<text class="at" x="345" y="431">takes the checkpoint before</text>
<text class="at" x="345" y="448">adopting a change</text>
</g>
<g class="bx-store"><rect x="20" y="379" width="255" height="101" rx="3"/>
<text class="st" x="147.5" y="393" text-anchor="middle">«guest»</text>
<text class="nm" x="147.5" y="409" text-anchor="middle">Guest tooling</text>
<line class="div" x1="20" y1="416" x2="275" y2="416"/>
<text class="at" x="30" y="431">vswhere + vs_installer export</text>
<text class="at" x="30" y="448">winget export</text>
<text class="at" x="30" y="465">Marketplace extensions</text>
</g>
<g class="bx-store"><rect x="20" y="490" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="504" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="520" text-anchor="middle">Config\VMs\&lt;VM&gt;\</text>
<line class="div" x1="20" y1="527" x2="275" y2="527"/>
<text class="at" x="30" y="542">Tooling.json</text>
</g>
<g class="bx-store"><rect x="740" y="379" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="393" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="409" text-anchor="middle">Config\VMs\&lt;VM&gt;\History\</text>
<line class="div" x1="740" y1="416" x2="1010" y2="416"/>
<text class="at" x="750" y="431">Daily\Tooling-&lt;date&gt;.json</text>
</g>
<g class="bx-store"><rect x="740" y="456" width="270" height="84" rx="3"/>
<text class="st" x="875.0" y="470" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875.0" y="486" text-anchor="middle">Checkpoints\&lt;VM&gt;\</text>
<line class="div" x1="740" y1="493" x2="1010" y2="493"/>
<text class="at" x="750" y="508">checkpoint &quot;Tooling &lt;stamp&gt;&quot;</text>
<text class="at" x="750" y="525">oldest pruned past 3</text>
</g>
<g class="bx-store"><rect x="740" y="550" width="270" height="84" rx="3"/>
<text class="st" x="875.0" y="564" text-anchor="middle">«file»</text>
<text class="nm" x="875.0" y="580" text-anchor="middle">Config\VMs\&lt;VM&gt;\</text>
<line class="div" x1="740" y1="587" x2="1010" y2="587"/>
<text class="at" x="750" y="602">Tooling.json</text>
<text class="at" x="750" y="619">History\Tooling-&lt;stamp&gt;.json</text>
</g>
<g class="bx-mod"><rect x="335" y="658" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="672" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="487.5" y="688" text-anchor="middle">Stop-GuestGracefully()</text>
<line class="div" x1="335" y1="695" x2="640" y2="695"/>
<g class="sn"><circle cx="351" cy="679" r="10"/><text x="351" y="683" text-anchor="middle">4</text></g>
<text class="at" x="345" y="710">only if it was started here</text>
</g>
<g class="bx-store"><rect x="740" y="658" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="672" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875.0" y="688" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="695" x2="1010" y2="695"/>
<text class="at" x="750" y="710">off</text>
</g>
</svg>
