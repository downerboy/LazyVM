<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 743" width="1030" height="743" role="img" aria-labelledby="t-tooling-record">
<title id="t-tooling-record">Record tooling now: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="743"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,649"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,205 L335,205" marker-end="url(#ad)"/>
<path class="df" d="M640,188 L740,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,312 L335,312" marker-end="url(#ac)"/>
<path class="df" d="M275,334 L335,334" marker-end="url(#ad)"/>
<path class="df" d="M640,334 L740,334" marker-end="url(#ad)"/>
<path class="cl" d="M305,424 L335,424" marker-end="url(#ac)"/>
<path class="df" d="M275,454.5 L335,454.5" marker-end="url(#ad)"/>
<path class="df" d="M275,559 L335,559" marker-end="url(#ad)"/>
<path class="df" d="M640,454.5 L740,454.5" marker-end="url(#ad)"/>
<path class="df" d="M640,559 L740,559" marker-end="url(#ad)"/>
<path class="cl" d="M305,649 L335,649" marker-end="url(#ac)"/>
<path class="df" d="M640,671 L740,671" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="205" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690" cy="188" r="10"/><text x="690" y="191.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="334" r="10"/><text x="293" y="337.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690" cy="334" r="10"/><text x="690" y="337.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="454.5" r="10"/><text x="293" y="458" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="559" r="10"/><text x="293" y="562.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="454.5" r="10"/><text x="690" y="458" text-anchor="middle">D7</text></g>
<g class="bd"><circle cx="690" cy="559" r="10"/><text x="690" y="562.5" text-anchor="middle">D8</text></g>
<g class="bd"><circle cx="690" cy="671" r="10"/><text x="690" y="674.5" text-anchor="middle">D9</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Save-LazyVMTooling</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">builds the VM context and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">HKLM:\SOFTWARE\LazyVM Root</text>
<text class="at" x="30" y="215">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="232">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="146" width="270" height="84" rx="3"/>
<text class="st" x="875" y="160" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="176" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="183" x2="1010" y2="183"/>
<text class="at" x="750" y="198">&lt;VM&gt;.log (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="292" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="306" text-anchor="middle">«Tooling»</text>
<text class="nm" x="500.5" y="322" text-anchor="middle">Open-GuestSession()</text>
<line class="div" x1="335" y1="329" x2="640" y2="329"/>
<g class="sn"><circle cx="351" cy="313" r="10"/><text x="351" y="317" text-anchor="middle">2</text></g>
<text class="at" x="345" y="344">starts the VM if it is off, connects</text>
<text class="at" x="345" y="361">with PowerShell Direct</text>
</g>
<g class="bx-store"><rect x="20" y="292" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="306" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="322" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="329" x2="275" y2="329"/>
<text class="at" x="30" y="344">Shared\Credentials\.lazyvm.key</text>
<text class="at" x="30" y="361">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="292" width="270" height="84" rx="3"/>
<text class="st" x="875" y="306" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="322" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="329" x2="1010" y2="329"/>
<text class="at" x="750" y="344">running</text>
</g>
<g class="bx-mod"><rect x="335" y="404" width="305" height="197" rx="3"/>
<text class="st" x="500.5" y="418" text-anchor="middle">«Tooling»</text>
<text class="nm" x="500.5" y="434" text-anchor="middle">Update-ToolingRecord()</text>
<line class="div" x1="335" y1="441" x2="640" y2="441"/>
<g class="sn"><circle cx="351" cy="425" r="10"/><text x="351" y="429" text-anchor="middle">3</text></g>
<text class="at" x="345" y="456">takes the checkpoint before adopting a</text>
<text class="at" x="345" y="473">change</text>
</g>
<g class="bx-store"><rect x="20" y="404" width="255" height="101" rx="3"/>
<text class="st" x="147.5" y="418" text-anchor="middle">«guest»</text>
<text class="nm" x="147.5" y="434" text-anchor="middle">Guest tooling</text>
<line class="div" x1="20" y1="441" x2="275" y2="441"/>
<text class="at" x="30" y="456">vswhere + vs_installer export</text>
<text class="at" x="30" y="473">winget export</text>
<text class="at" x="30" y="490">Marketplace extensions</text>
</g>
<g class="bx-store"><rect x="20" y="517" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="531" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="547" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="20" y1="554" x2="275" y2="554"/>
<text class="at" x="30" y="569">VM.json</text>
</g>
<g class="bx-store"><rect x="740" y="404" width="270" height="101" rx="3"/>
<text class="st" x="875" y="418" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="434" text-anchor="middle">&lt;VM&gt;\Checkpoints\</text>
<line class="div" x1="740" y1="441" x2="1010" y2="441"/>
<text class="at" x="750" y="456">checkpoint &quot;Tooling &lt;stamp&gt;&quot;</text>
<text class="at" x="750" y="473">oldest pruned past</text>
<text class="at" x="750" y="490">ToolingCheckpointsToKeep (3)</text>
</g>
<g class="bx-store"><rect x="740" y="517" width="270" height="84" rx="3"/>
<text class="st" x="875" y="531" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="547" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="740" y1="554" x2="1010" y2="554"/>
<text class="at" x="750" y="569">VM.json</text>
<text class="at" x="750" y="586">History\VM-&lt;stamp&gt;.json</text>
</g>
<g class="bx-mod"><rect x="335" y="629" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="643" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="659" text-anchor="middle">Stop-GuestGracefully()</text>
<line class="div" x1="335" y1="666" x2="640" y2="666"/>
<g class="sn"><circle cx="351" cy="650" r="10"/><text x="351" y="654" text-anchor="middle">4</text></g>
<text class="at" x="345" y="681">only if this run started the VM</text>
</g>
<g class="bx-store"><rect x="740" y="629" width="270" height="84" rx="3"/>
<text class="st" x="875" y="643" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="659" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="666" x2="1010" y2="666"/>
<text class="at" x="750" y="681">off</text>
</g>
</svg>
