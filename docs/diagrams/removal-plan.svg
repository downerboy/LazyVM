<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 839" width="1030" height="839" role="img" aria-labelledby="t-removal-plan">
<title id="t-removal-plan">List what removing a VM deletes: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="839"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,711"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,188 L335,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,278 L335,278" marker-end="url(#ac)"/>
<path class="df" d="M275,300 L335,300" marker-end="url(#ad)"/>
<path class="cl" d="M305,407 L335,407" marker-end="url(#ac)"/>
<path class="df" d="M275,429 L335,429" marker-end="url(#ad)"/>
<path class="df" d="M275,525 L335,525" marker-end="url(#ad)"/>
<path class="df" d="M275,621 L335,621" marker-end="url(#ad)"/>
<path class="cl" d="M305,711 L335,711" marker-end="url(#ac)"/>
<path class="df" d="M640,750 L740,750" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="300" r="10"/><text x="293" y="303.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="429" r="10"/><text x="293" y="432.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="525" r="10"/><text x="293" y="528.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="621" r="10"/><text x="293" y="624.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="750" r="10"/><text x="690" y="753.5" text-anchor="middle">D6</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Get-LazyVMRemovalPlan</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">the LazyVM folder</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="258" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="272" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="288" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="295" x2="640" y2="295"/>
<g class="sn"><circle cx="351" cy="279" r="10"/><text x="351" y="283" text-anchor="middle">2</text></g>
<text class="at" x="345" y="310">read-only: the VM&apos;s settings, and in</text>
<text class="at" x="345" y="327">Get-VMRemovalPreview every other VM&apos;s,</text>
<text class="at" x="345" y="344">so nothing they use is listed</text>
</g>
<g class="bx-store"><rect x="20" y="258" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="272" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="288" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="295" x2="275" y2="295"/>
<text class="at" x="30" y="310">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="327">*\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="387" width="305" height="276" rx="3"/>
<text class="st" x="500.5" y="401" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="417" text-anchor="middle">Get-VMRemovalPreview()</text>
<line class="div" x1="335" y1="424" x2="640" y2="424"/>
<g class="sn"><circle cx="351" cy="408" r="10"/><text x="351" y="412" text-anchor="middle">3</text></g>
<text class="at" x="345" y="439">what Remove-LazyVM deletes and keeps, as</text>
<text class="at" x="345" y="456">it decides it, with each item&apos;s size</text>
</g>
<g class="bx-store"><rect x="20" y="387" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="401" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="417" text-anchor="middle">Hyper-V</text>
<line class="div" x1="20" y1="424" x2="275" y2="424"/>
<text class="at" x="30" y="439">disks of &lt;VM&gt;</text>
<text class="at" x="30" y="456">disks of other VMs</text>
</g>
<g class="bx-store"><rect x="20" y="483" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="497" text-anchor="middle">«task»</text>
<text class="nm" x="147.5" y="513" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="20" y1="520" x2="275" y2="520"/>
<text class="at" x="30" y="535">LazyVM-Maintain-&lt;VM&gt;</text>
<text class="at" x="30" y="552">LazyVM-ResumeAfterReboot-&lt;VM&gt;</text>
</g>
<g class="bx-store"><rect x="20" y="579" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="593" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="609" text-anchor="middle">VM folder</text>
<line class="div" x1="20" y1="616" x2="275" y2="616"/>
<text class="at" x="30" y="631">&lt;VM&gt;\ and anything a setting put</text>
<text class="at" x="30" y="648">elsewhere</text>
</g>
<g class="bx-mod"><rect x="335" y="691" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="705" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="721" text-anchor="middle">Get-VMRemovalPlan()</text>
<line class="div" x1="335" y1="728" x2="640" y2="728"/>
<g class="sn"><circle cx="351" cy="712" r="10"/><text x="351" y="716" text-anchor="middle">4</text></g>
<text class="at" x="345" y="743">called by Get-VMRemovalPreview</text>
<text class="at" x="345" y="760">decides what goes and what is kept, and</text>
<text class="at" x="345" y="777">why; stops when the VM folder holds</text>
<text class="at" x="345" y="794">something another VM uses</text>
</g>
<g class="bx-store"><rect x="740" y="691" width="270" height="118" rx="3"/>
<text class="st" x="875" y="705" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="721" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="728" x2="1010" y2="728"/>
<text class="at" x="750" y="743">LazyVM.RemovalPlan: HyperVState,</text>
<text class="at" x="750" y="760">CheckpointCount, Tasks, Items,</text>
<text class="at" x="750" y="777">Total,</text>
<text class="at" x="750" y="794">Kept, WorkDisks</text>
</g>
</svg>
