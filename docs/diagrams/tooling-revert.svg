<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1052" width="1030" height="1052" role="img" aria-labelledby="t-tooling-revert">
<title id="t-tooling-revert">Return to an earlier tooling version: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="1052"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,941"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="df" d="M275,222 L335,222" marker-end="url(#ad)"/>
<path class="df" d="M640,205 L740,205" marker-end="url(#ad)"/>
<path class="cl" d="M305,329 L335,329" marker-end="url(#ac)"/>
<path class="df" d="M275,351 L335,351" marker-end="url(#ad)"/>
<path class="df" d="M275,447 L335,447" marker-end="url(#ad)"/>
<path class="cl" d="M305,537 L335,537" marker-end="url(#ac)"/>
<path class="df" d="M640,559 L740,559" marker-end="url(#ad)"/>
<path class="cl" d="M305,666 L335,666" marker-end="url(#ac)"/>
<path class="df" d="M275,688 L335,688" marker-end="url(#ad)"/>
<path class="df" d="M640,688 L740,688" marker-end="url(#ad)"/>
<path class="cl" d="M305,795 L335,795" marker-end="url(#ac)"/>
<path class="df" d="M640,817 L740,817" marker-end="url(#ad)"/>
<path class="cl" d="M305,941 L335,941" marker-end="url(#ac)"/>
<path class="df" d="M640,963 L740,963" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="222" r="10"/><text x="293" y="225.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690" cy="205" r="10"/><text x="690" y="208.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="351" r="10"/><text x="293" y="354.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="447" r="10"/><text x="293" y="450.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="559" r="10"/><text x="690" y="562.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="293" cy="688" r="10"/><text x="293" y="691.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="688" r="10"/><text x="690" y="691.5" text-anchor="middle">D7</text></g>
<g class="bd"><circle cx="690" cy="817" r="10"/><text x="690" y="820.5" text-anchor="middle">D8</text></g>
<g class="bd"><circle cx="690" cy="963" r="10"/><text x="690" y="966.5" text-anchor="middle">D9</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Restore-LazyVMTooling</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-RestorePoint yyyyMMdd-HHmmss</text>
<text class="at" x="345" y="120">-Force (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="177" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="193" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">builds the VM context and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">HKLM:\SOFTWARE\LazyVM Root</text>
<text class="at" x="30" y="232">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="266">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="163" width="270" height="84" rx="3"/>
<text class="st" x="875" y="177" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="193" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="200" x2="1010" y2="200"/>
<text class="at" x="750" y="215">&lt;VM&gt;.log (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="309" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="323" text-anchor="middle">«Tooling»</text>
<text class="nm" x="500.5" y="339" text-anchor="middle">Invoke-ToolingRevert()</text>
<line class="div" x1="335" y1="346" x2="640" y2="346"/>
<g class="sn"><circle cx="351" cy="330" r="10"/><text x="351" y="334" text-anchor="middle">2</text></g>
<text class="at" x="345" y="361">steps 3-6 are its calls; stops before</text>
<text class="at" x="345" y="378">changing anything if the checkpoint or</text>
<text class="at" x="345" y="395">its list is missing</text>
</g>
<g class="bx-store"><rect x="20" y="309" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="323" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="339" text-anchor="middle">&lt;VM&gt;\Checkpoints\</text>
<line class="div" x1="20" y1="346" x2="275" y2="346"/>
<text class="at" x="30" y="361">&quot;Tooling &lt;stamp&gt;&quot;</text>
</g>
<g class="bx-store"><rect x="20" y="405" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="419" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="435" text-anchor="middle">&lt;VM&gt;\Config\History\</text>
<line class="div" x1="20" y1="442" x2="275" y2="442"/>
<text class="at" x="30" y="457">VM-&lt;stamp&gt;.json</text>
</g>
<g class="bx-mod"><rect x="335" y="517" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="531" text-anchor="middle">«Tooling»</text>
<text class="nm" x="500.5" y="547" text-anchor="middle">New-ToolingCheckpoint -SkipPrune</text>
<line class="div" x1="335" y1="554" x2="640" y2="554"/>
<g class="sn"><circle cx="351" cy="538" r="10"/><text x="351" y="542" text-anchor="middle">3</text></g>
<text class="at" x="345" y="569">called by Invoke-ToolingRevert</text>
<text class="at" x="345" y="586">the current state, so the revert can be</text>
<text class="at" x="345" y="603">undone</text>
</g>
<g class="bx-store"><rect x="740" y="517" width="270" height="84" rx="3"/>
<text class="st" x="875" y="531" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="547" text-anchor="middle">&lt;VM&gt;\Checkpoints\</text>
<line class="div" x1="740" y1="554" x2="1010" y2="554"/>
<text class="at" x="750" y="569">&quot;Tooling &lt;now&gt; before revert&quot;</text>
</g>
<g class="bx-mod"><rect x="335" y="646" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="660" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="676" text-anchor="middle">Save-ProfileVersion()</text>
<line class="div" x1="335" y1="683" x2="640" y2="683"/>
<g class="sn"><circle cx="351" cy="667" r="10"/><text x="351" y="671" text-anchor="middle">4</text></g>
<text class="at" x="345" y="698">called by Invoke-ToolingRevert</text>
<text class="at" x="345" y="715">keeps VM.json as it is now under the</text>
<text class="at" x="345" y="732">same date-time</text>
</g>
<g class="bx-store"><rect x="20" y="646" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="660" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="676" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="20" y1="683" x2="275" y2="683"/>
<text class="at" x="30" y="698">VM.json</text>
</g>
<g class="bx-store"><rect x="740" y="646" width="270" height="84" rx="3"/>
<text class="st" x="875" y="660" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="676" text-anchor="middle">&lt;VM&gt;\Config\History\</text>
<line class="div" x1="740" y1="683" x2="1010" y2="683"/>
<text class="at" x="750" y="698">VM-&lt;now&gt;.json</text>
</g>
<g class="bx-mod"><rect x="335" y="775" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="789" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="500.5" y="805" text-anchor="middle">Restore-VMSnapshot()</text>
<line class="div" x1="335" y1="812" x2="640" y2="812"/>
<g class="sn"><circle cx="351" cy="796" r="10"/><text x="351" y="800" text-anchor="middle">5</text></g>
<text class="at" x="345" y="827">called by Invoke-ToolingRevert</text>
<text class="at" x="345" y="844">after closing the guest session</text>
<text class="at" x="345" y="861">(Remove-GuestSession); starts the VM</text>
<text class="at" x="345" y="878">again if it was running</text>
</g>
<g class="bx-store"><rect x="740" y="775" width="270" height="84" rx="3"/>
<text class="st" x="875" y="789" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="805" text-anchor="middle">VM &lt;VM&gt;</text>
<line class="div" x1="740" y1="812" x2="1010" y2="812"/>
<text class="at" x="750" y="827">every disk back to &lt;stamp&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="921" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="935" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="951" text-anchor="middle">Restore-ProfileTooling()</text>
<line class="div" x1="335" y1="958" x2="640" y2="958"/>
<g class="sn"><circle cx="351" cy="942" r="10"/><text x="351" y="946" text-anchor="middle">6</text></g>
<text class="at" x="345" y="973">called by Invoke-ToolingRevert</text>
<text class="at" x="345" y="990">puts that version&apos;s tooling list back in</text>
<text class="at" x="345" y="1007">VM.json</text>
</g>
<g class="bx-store"><rect x="740" y="921" width="270" height="84" rx="3"/>
<text class="st" x="875" y="935" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="951" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="740" y1="958" x2="1010" y2="958"/>
<text class="at" x="750" y="973">VM.json Tooling</text>
</g>
</svg>
