<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1242" width="1030" height="1242" role="img" aria-labelledby="t-recovery-key-export">
<title id="t-recovery-key-export">Export the recovery passwords: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="1242"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,1052"/>
<path class="cl" d="M305,200 L335,200" marker-end="url(#ac)"/>
<path class="df" d="M275,222 L335,222" marker-end="url(#ad)"/>
<path class="cl" d="M305,312 L335,312" marker-end="url(#ac)"/>
<path class="df" d="M275,334 L335,334" marker-end="url(#ad)"/>
<path class="cl" d="M305,441 L335,441" marker-end="url(#ac)"/>
<path class="df" d="M275,463 L335,463" marker-end="url(#ad)"/>
<path class="cl" d="M305,553 L335,553" marker-end="url(#ac)"/>
<path class="df" d="M275,575 L335,575" marker-end="url(#ad)"/>
<path class="cl" d="M305,665 L335,665" marker-end="url(#ac)"/>
<path class="cl" d="M305,828 L335,828" marker-end="url(#ac)"/>
<path class="cl" d="M305,940 L335,940" marker-end="url(#ac)"/>
<path class="df" d="M640,962 L740,962" marker-end="url(#ad)"/>
<path class="cl" d="M305,1052 L335,1052" marker-end="url(#ac)"/>
<path class="df" d="M640,1074 L740,1074" marker-end="url(#ad)"/>
<path class="df" d="M640,1170 L740,1170" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="222" r="10"/><text x="293" y="225.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="334" r="10"/><text x="293" y="337.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="463" r="10"/><text x="293" y="466.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="575" r="10"/><text x="293" y="578.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="962" r="10"/><text x="690" y="965.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="1074" r="10"/><text x="690" y="1077.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="1170" r="10"/><text x="690" y="1173.5" text-anchor="middle">D7</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="118" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Export-LazyVMRecoveryKey</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM, wildcards&gt; (optional, default</text>
<text class="at" x="345" y="103">*)</text>
<text class="at" x="345" y="120">-Path &lt;file&gt;</text>
<text class="at" x="345" y="137">-Force (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="180" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="194" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="210" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="217" x2="640" y2="217"/>
<g class="sn"><circle cx="351" cy="201" r="10"/><text x="351" y="205" text-anchor="middle">1</text></g>
<text class="at" x="345" y="232">the LazyVM folder</text>
</g>
<g class="bx-store"><rect x="20" y="180" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="194" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="210" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="217" x2="275" y2="217"/>
<text class="at" x="30" y="232">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="292" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="306" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="322" text-anchor="middle">Select-VMProfileName()</text>
<line class="div" x1="335" y1="329" x2="640" y2="329"/>
<g class="sn"><circle cx="351" cy="313" r="10"/><text x="351" y="317" text-anchor="middle">2</text></g>
<text class="at" x="345" y="344">the VMs -Name matches, every VM by</text>
<text class="at" x="345" y="361">default; stops for a name without</text>
<text class="at" x="345" y="378">wildcards that no VM has</text>
</g>
<g class="bx-store"><rect x="20" y="292" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="306" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="322" text-anchor="middle">&lt;Root&gt;\</text>
<line class="div" x1="20" y1="329" x2="275" y2="329"/>
<text class="at" x="30" y="344">*\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="421" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="435" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="451" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="458" x2="640" y2="458"/>
<g class="sn"><circle cx="351" cy="442" r="10"/><text x="351" y="446" text-anchor="middle">3</text></g>
<text class="at" x="345" y="473">each VM&apos;s settings, read only</text>
</g>
<g class="bx-store"><rect x="20" y="421" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="435" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="451" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="458" x2="275" y2="458"/>
<text class="at" x="30" y="473">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="490">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="533" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="547" text-anchor="middle">«Disks»</text>
<text class="nm" x="500.5" y="563" text-anchor="middle">Get-StoredRecoveryKey()</text>
<line class="div" x1="335" y1="570" x2="640" y2="570"/>
<g class="sn"><circle cx="351" cy="554" r="10"/><text x="351" y="558" text-anchor="middle">4</text></g>
<text class="at" x="345" y="585">every disk&apos;s recovery password, key ID</text>
<text class="at" x="345" y="602">and date; stops when none is stored</text>
</g>
<g class="bx-store"><rect x="20" y="533" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="547" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="563" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="570" x2="275" y2="570"/>
<text class="at" x="30" y="585">&lt;VM&gt;\Credentials\bitlocker.cred</text>
</g>
<g class="bx-mod"><rect x="335" y="645" width="305" height="135" rx="3"/>
<text class="st" x="500.5" y="659" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="675" text-anchor="middle">Test-PathWithin()</text>
<line class="div" x1="335" y1="682" x2="640" y2="682"/>
<g class="sn"><circle cx="351" cy="666" r="10"/><text x="351" y="670" text-anchor="middle">5</text></g>
<text class="at" x="345" y="697">before asking: stops for a missing</text>
<text class="at" x="345" y="714">folder or an existing file without</text>
<text class="at" x="345" y="731">-Force; warns when -Force with -Name</text>
<text class="at" x="345" y="748">drops other VMs&apos; keys, and for a file in</text>
<text class="at" x="345" y="765">the LazyVM folder or OneDrive</text>
</g>
<g class="bx-mod"><rect x="335" y="808" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="822" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="838" text-anchor="middle">Use-RunRoot()</text>
<line class="div" x1="335" y1="845" x2="640" y2="845"/>
<g class="sn"><circle cx="351" cy="829" r="10"/><text x="351" y="833" text-anchor="middle">6</text></g>
<text class="at" x="345" y="860">the writes below are checked for reparse</text>
<text class="at" x="345" y="877">points in the LazyVM folder</text>
</g>
<g class="bx-mod"><rect x="335" y="920" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="934" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="950" text-anchor="middle">Write-TextFileAtomic()</text>
<line class="div" x1="335" y1="957" x2="640" y2="957"/>
<g class="sn"><circle cx="351" cy="941" r="10"/><text x="351" y="945" text-anchor="middle">7</text></g>
<text class="at" x="345" y="972">called by Use-RunRoot</text>
<text class="at" x="345" y="989">the file, plain text, one field per line</text>
</g>
<g class="bx-store"><rect x="740" y="920" width="270" height="84" rx="3"/>
<text class="st" x="875" y="934" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="950" text-anchor="middle">-Path</text>
<line class="div" x1="740" y1="957" x2="1010" y2="957"/>
<text class="at" x="750" y="972">&lt;file&gt;, such as on a USB drive</text>
</g>
<g class="bx-mod"><rect x="335" y="1032" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="1046" text-anchor="middle">«Disks»</text>
<text class="nm" x="500.5" y="1062" text-anchor="middle">Save-RecoveryKeyExportRecord()</text>
<line class="div" x1="335" y1="1069" x2="640" y2="1069"/>
<g class="sn"><circle cx="351" cy="1053" r="10"/><text x="351" y="1057" text-anchor="middle">8</text></g>
<text class="at" x="345" y="1084">called by Use-RunRoot</text>
<text class="at" x="345" y="1101">which keys each VM&apos;s export held, by</text>
<text class="at" x="345" y="1118">disk GUID and key ID, never the</text>
<text class="at" x="345" y="1135">passwords</text>
</g>
<g class="bx-store"><rect x="740" y="1032" width="270" height="84" rx="3"/>
<text class="st" x="875" y="1046" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="1062" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="740" y1="1069" x2="1010" y2="1069"/>
<text class="at" x="750" y="1084">RecoveryKeyExport.json</text>
</g>
<g class="bx-store"><rect x="740" y="1128" width="270" height="84" rx="3"/>
<text class="st" x="875" y="1142" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="1158" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="1165" x2="1010" y2="1165"/>
<text class="at" x="750" y="1180">FileInfo</text>
</g>
</svg>
