<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1079" width="1030" height="1079" role="img" aria-labelledby="t-recovery-key-export">
<title id="t-recovery-key-export">Export the recovery passwords: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="1079"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,889"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="df" d="M275,205 L335,205" marker-end="url(#ad)"/>
<path class="cl" d="M305,295 L335,295" marker-end="url(#ac)"/>
<path class="df" d="M275,317 L335,317" marker-end="url(#ad)"/>
<path class="cl" d="M305,407 L335,407" marker-end="url(#ac)"/>
<path class="df" d="M275,429 L335,429" marker-end="url(#ad)"/>
<path class="cl" d="M305,519 L335,519" marker-end="url(#ac)"/>
<path class="df" d="M275,541 L335,541" marker-end="url(#ad)"/>
<path class="cl" d="M305,631 L335,631" marker-end="url(#ac)"/>
<path class="cl" d="M305,777 L335,777" marker-end="url(#ac)"/>
<path class="df" d="M640,799 L740,799" marker-end="url(#ad)"/>
<path class="cl" d="M305,889 L335,889" marker-end="url(#ac)"/>
<path class="df" d="M640,911 L740,911" marker-end="url(#ad)"/>
<path class="df" d="M640,1007 L740,1007" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="205" r="10"/><text x="293" y="208.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="317" r="10"/><text x="293" y="320.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="429" r="10"/><text x="293" y="432.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="541" r="10"/><text x="293" y="544.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="799" r="10"/><text x="690" y="802.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="911" r="10"/><text x="690" y="914.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="1007" r="10"/><text x="690" y="1010.5" text-anchor="middle">D7</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Export-LazyVMRecoveryKey</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt; (optional)</text>
<text class="at" x="345" y="103">-Path &lt;file&gt;</text>
<text class="at" x="345" y="120">-Force (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="177" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="193" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">the LazyVM folder</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="275" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="289" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="305" text-anchor="middle">Resolve-VMSelection()</text>
<line class="div" x1="335" y1="312" x2="640" y2="312"/>
<g class="sn"><circle cx="351" cy="296" r="10"/><text x="351" y="300" text-anchor="middle">2</text></g>
<text class="at" x="345" y="327">the VM named, or with no -Name every VM</text>
<text class="at" x="345" y="344">(Get-VMProfileName)</text>
</g>
<g class="bx-store"><rect x="20" y="275" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="289" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="305" text-anchor="middle">&lt;Root&gt;\</text>
<line class="div" x1="20" y1="312" x2="275" y2="312"/>
<text class="at" x="30" y="327">*\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="387" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="401" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="417" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="424" x2="640" y2="424"/>
<g class="sn"><circle cx="351" cy="408" r="10"/><text x="351" y="412" text-anchor="middle">3</text></g>
<text class="at" x="345" y="439">each VM&apos;s settings, read only</text>
</g>
<g class="bx-store"><rect x="20" y="387" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="401" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="417" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="424" x2="275" y2="424"/>
<text class="at" x="30" y="439">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="456">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="499" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="513" text-anchor="middle">«Disks»</text>
<text class="nm" x="500.5" y="529" text-anchor="middle">Get-StoredRecoveryKey()</text>
<line class="div" x1="335" y1="536" x2="640" y2="536"/>
<g class="sn"><circle cx="351" cy="520" r="10"/><text x="351" y="524" text-anchor="middle">4</text></g>
<text class="at" x="345" y="551">every disk&apos;s recovery password, key ID</text>
<text class="at" x="345" y="568">and date; stops when none is stored</text>
</g>
<g class="bx-store"><rect x="20" y="499" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="513" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="529" text-anchor="middle">Credential store</text>
<line class="div" x1="20" y1="536" x2="275" y2="536"/>
<text class="at" x="30" y="551">&lt;VM&gt;\Credentials\bitlocker.cred</text>
</g>
<g class="bx-mod"><rect x="335" y="611" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="625" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="641" text-anchor="middle">Test-PathWithin()</text>
<line class="div" x1="335" y1="648" x2="640" y2="648"/>
<g class="sn"><circle cx="351" cy="632" r="10"/><text x="351" y="636" text-anchor="middle">5</text></g>
<text class="at" x="345" y="663">before asking: stops for a missing</text>
<text class="at" x="345" y="680">folder or an existing file without</text>
<text class="at" x="345" y="697">-Force; warns for a file in the LazyVM</text>
<text class="at" x="345" y="714">folder or OneDrive</text>
</g>
<g class="bx-mod"><rect x="335" y="757" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="771" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="787" text-anchor="middle">Write-TextFileAtomic()</text>
<line class="div" x1="335" y1="794" x2="640" y2="794"/>
<g class="sn"><circle cx="351" cy="778" r="10"/><text x="351" y="782" text-anchor="middle">6</text></g>
<text class="at" x="345" y="809">the file, plain text, one field per line</text>
</g>
<g class="bx-store"><rect x="740" y="757" width="270" height="84" rx="3"/>
<text class="st" x="875" y="771" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="787" text-anchor="middle">-Path</text>
<line class="div" x1="740" y1="794" x2="1010" y2="794"/>
<text class="at" x="750" y="809">&lt;file&gt;, such as on a USB drive</text>
</g>
<g class="bx-mod"><rect x="335" y="869" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="883" text-anchor="middle">«Disks»</text>
<text class="nm" x="500.5" y="899" text-anchor="middle">Save-RecoveryKeyExportRecord()</text>
<line class="div" x1="335" y1="906" x2="640" y2="906"/>
<g class="sn"><circle cx="351" cy="890" r="10"/><text x="351" y="894" text-anchor="middle">7</text></g>
<text class="at" x="345" y="921">which keys each VM&apos;s export held, by</text>
<text class="at" x="345" y="938">disk GUID and key ID, never the</text>
<text class="at" x="345" y="955">passwords</text>
</g>
<g class="bx-store"><rect x="740" y="869" width="270" height="84" rx="3"/>
<text class="st" x="875" y="883" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="899" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="740" y1="906" x2="1010" y2="906"/>
<text class="at" x="750" y="921">RecoveryKeyExport.json</text>
</g>
<g class="bx-store"><rect x="740" y="965" width="270" height="84" rx="3"/>
<text class="st" x="875" y="979" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="995" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="1002" x2="1010" y2="1002"/>
<text class="at" x="750" y="1017">FileInfo</text>
</g>
</svg>
