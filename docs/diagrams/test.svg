<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 790" width="1030" height="790" role="img" aria-labelledby="t-test">
<title id="t-test">Check a VM end to end: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="790"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,696"/>
<path class="cl" d="M305,200 L335,200" marker-end="url(#ac)"/>
<path class="df" d="M275,222 L335,222" marker-end="url(#ad)"/>
<path class="df" d="M275,318 L335,318" marker-end="url(#ad)"/>
<path class="df" d="M275,414 L335,414" marker-end="url(#ad)"/>
<path class="df" d="M275,510 L335,510" marker-end="url(#ad)"/>
<path class="df" d="M275,606 L335,606" marker-end="url(#ad)"/>
<path class="df" d="M640,222 L740,222" marker-end="url(#ad)"/>
<path class="cl" d="M305,696 L335,696" marker-end="url(#ac)"/>
<path class="df" d="M640,718 L740,718" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="222" r="10"/><text x="293" y="225.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="318" r="10"/><text x="293" y="321.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="414" r="10"/><text x="293" y="417.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="510" r="10"/><text x="293" y="513.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="606" r="10"/><text x="293" y="609.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="222" r="10"/><text x="690" y="225.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="718" r="10"/><text x="690" y="721.5" text-anchor="middle">D7</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="118" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Test-LazyVM</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt; (optional with one VM or</text>
<text class="at" x="345" y="103">none)</text>
<text class="at" x="345" y="120">-HostOnly (optional)</text>
<text class="at" x="345" y="137">-ReportPath &lt;file&gt; (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="180" width="305" height="468" rx="3"/>
<text class="st" x="500.5" y="194" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="210" text-anchor="middle">Get-LazyVMDiagnostic()</text>
<line class="div" x1="335" y1="217" x2="640" y2="217"/>
<g class="sn"><circle cx="351" cy="201" r="10"/><text x="351" y="205" text-anchor="middle">1</text></g>
<text class="at" x="345" y="232">the host checks first, then the VM&apos;s;</text>
<text class="at" x="345" y="249">one that cannot be made is a FAIL and</text>
<text class="at" x="345" y="266">the rest still run</text>
</g>
<g class="bx-store"><rect x="20" y="180" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="194" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="210" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="217" x2="275" y2="217"/>
<text class="at" x="30" y="232">HKCU:\SOFTWARE\LazyVM Root</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-store"><rect x="20" y="276" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="290" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="306" text-anchor="middle">Shared\</text>
<line class="div" x1="20" y1="313" x2="275" y2="313"/>
<text class="at" x="30" y="328">ISO\Win11Ent_Eval.iso</text>
<text class="at" x="30" y="345">Installers\SQLServer2025 ISO</text>
</g>
<g class="bx-store"><rect x="20" y="372" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="386" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="402" text-anchor="middle">&lt;VM&gt;\</text>
<line class="div" x1="20" y1="409" x2="275" y2="409"/>
<text class="at" x="30" y="424">Credentials\bitlocker.cred</text>
<text class="at" x="30" y="441">Config\RecoveryKeyExport.json</text>
</g>
<g class="bx-store"><rect x="20" y="468" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="482" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="498" text-anchor="middle">Hyper-V and Task Scheduler</text>
<line class="div" x1="20" y1="505" x2="275" y2="505"/>
<text class="at" x="30" y="520">VM &lt;VM&gt;</text>
<text class="at" x="30" y="537">LazyVM-Maintain-&lt;VM&gt;</text>
</g>
<g class="bx-store"><rect x="20" y="564" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="578" text-anchor="middle">«guest»</text>
<text class="nm" x="147.5" y="594" text-anchor="middle">Running guest</text>
<line class="div" x1="20" y1="601" x2="275" y2="601"/>
<text class="at" x="30" y="616">PowerShell Direct, disks</text>
<text class="at" x="30" y="633">automatic sign-in on or off</text>
</g>
<g class="bx-store"><rect x="740" y="180" width="270" height="84" rx="3"/>
<text class="st" x="875" y="194" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="210" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="217" x2="1010" y2="217"/>
<text class="at" x="750" y="232">Status, Area, Check, Detail, Fix</text>
</g>
<g class="bx-mod"><rect x="335" y="676" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="690" text-anchor="middle">«PowerShell»</text>
<text class="nm" x="500.5" y="706" text-anchor="middle">Set-Content()</text>
<line class="div" x1="335" y1="713" x2="640" y2="713"/>
<g class="sn"><circle cx="351" cy="697" r="10"/><text x="351" y="701" text-anchor="middle">2</text></g>
<text class="at" x="345" y="728">only with -ReportPath: the same checks</text>
<text class="at" x="345" y="745">as a text report</text>
</g>
<g class="bx-store"><rect x="740" y="676" width="270" height="84" rx="3"/>
<text class="st" x="875" y="690" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="706" text-anchor="middle">-ReportPath</text>
<line class="div" x1="740" y1="713" x2="1010" y2="713"/>
<text class="at" x="750" y="728">&lt;file&gt;</text>
</g>
</svg>
