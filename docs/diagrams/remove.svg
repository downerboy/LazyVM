<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1201" width="1030" height="1201" role="img" aria-labelledby="t-remove">
<title id="t-remove">Remove a VM: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="1201"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,841"/>
<path class="cl" d="M305,183 L335,183" marker-end="url(#ac)"/>
<path class="df" d="M275,222 L335,222" marker-end="url(#ad)"/>
<path class="df" d="M640,205 L740,205" marker-end="url(#ad)"/>
<path class="cl" d="M305,329 L335,329" marker-end="url(#ac)"/>
<path class="df" d="M275,351 L335,351" marker-end="url(#ad)"/>
<path class="df" d="M275,447 L335,447" marker-end="url(#ad)"/>
<path class="df" d="M640,359.5 L740,359.5" marker-end="url(#ad)"/>
<path class="cl" d="M305,537 L335,537" marker-end="url(#ac)"/>
<path class="df" d="M640,559 L740,559" marker-end="url(#ad)"/>
<path class="df" d="M640,655 L740,655" marker-end="url(#ad)"/>
<path class="df" d="M640,751 L740,751" marker-end="url(#ad)"/>
<path class="cl" d="M305,841 L335,841" marker-end="url(#ac)"/>
<path class="df" d="M640,897 L740,897" marker-end="url(#ad)"/>
<path class="df" d="M640,1078 L740,1078" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="222" r="10"/><text x="293" y="225.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="690" cy="205" r="10"/><text x="690" y="208.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="351" r="10"/><text x="293" y="354.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="447" r="10"/><text x="293" y="450.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="359.5" r="10"/><text x="690" y="363" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="559" r="10"/><text x="690" y="562.5" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="655" r="10"/><text x="690" y="658.5" text-anchor="middle">D7</text></g>
<g class="bd"><circle cx="690" cy="751" r="10"/><text x="690" y="754.5" text-anchor="middle">D8</text></g>
<g class="bd"><circle cx="690" cy="897" r="10"/><text x="690" y="900.5" text-anchor="middle">D9</text></g>
<g class="bd"><circle cx="690" cy="1078" r="10"/><text x="690" y="1081.5" text-anchor="middle">D10</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="101" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Remove-LazyVM</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt;</text>
<text class="at" x="345" y="103">-WhatIf (lists everything)</text>
<text class="at" x="345" y="120">-Force (optional)</text>
</g>
<g class="bx-mod"><rect x="335" y="163" width="305" height="118" rx="3"/>
<text class="st" x="500.5" y="177" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="193" text-anchor="middle">Initialize-CommandRun()</text>
<line class="div" x1="335" y1="200" x2="640" y2="200"/>
<g class="sn"><circle cx="351" cy="184" r="10"/><text x="351" y="188" text-anchor="middle">1</text></g>
<text class="at" x="345" y="215">builds the VM context and opens the log</text>
</g>
<g class="bx-store"><rect x="20" y="163" width="255" height="118" rx="3"/>
<text class="st" x="147.5" y="177" text-anchor="middle">«settings»</text>
<text class="nm" x="147.5" y="193" text-anchor="middle">VM context sources</text>
<line class="div" x1="20" y1="200" x2="275" y2="200"/>
<text class="at" x="30" y="215">HKLM:\SOFTWARE\LazyVM Root</text>
<text class="at" x="30" y="232">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="249">&lt;VM&gt;\Config\VM.json</text>
<text class="at" x="30" y="266">&lt;VM&gt;\Credentials\guest.cred</text>
</g>
<g class="bx-store"><rect x="740" y="163" width="270" height="84" rx="3"/>
<text class="st" x="875" y="177" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="193" text-anchor="middle">&lt;VM&gt;\Logs\</text>
<line class="div" x1="740" y1="200" x2="1010" y2="200"/>
<text class="at" x="750" y="215">&lt;VM&gt;.log (appended)</text>
</g>
<g class="bx-mod"><rect x="335" y="309" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="323" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="339" text-anchor="middle">Get-VMRemovalContext()</text>
<line class="div" x1="335" y1="346" x2="640" y2="346"/>
<g class="sn"><circle cx="351" cy="330" r="10"/><text x="351" y="334" text-anchor="middle">2</text></g>
<text class="at" x="345" y="361">Get-VMRemovalPlan decides what to delete</text>
<text class="at" x="345" y="378">and keep; lists it with sizes</text>
</g>
<g class="bx-store"><rect x="20" y="309" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="323" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="339" text-anchor="middle">*\Config\</text>
<line class="div" x1="20" y1="346" x2="275" y2="346"/>
<text class="at" x="30" y="361">other VMs&apos; VM.json</text>
</g>
<g class="bx-store"><rect x="20" y="405" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="419" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="435" text-anchor="middle">Hyper-V</text>
<line class="div" x1="20" y1="442" x2="275" y2="442"/>
<text class="at" x="30" y="457">disks of &lt;VM&gt;</text>
<text class="at" x="30" y="474">disks of other VMs</text>
</g>
<g class="bx-store"><rect x="740" y="309" width="270" height="101" rx="3"/>
<text class="st" x="875" y="323" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="339" text-anchor="middle">Log and screen</text>
<line class="div" x1="740" y1="346" x2="1010" y2="346"/>
<text class="at" x="750" y="361">what will be deleted</text>
<text class="at" x="750" y="378">what is kept</text>
<text class="at" x="750" y="395">and why</text>
</g>
<g class="bx-mod"><rect x="335" y="517" width="305" height="276" rx="3"/>
<text class="st" x="500.5" y="531" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="547" text-anchor="middle">Invoke-VMRemoval()</text>
<line class="div" x1="335" y1="554" x2="640" y2="554"/>
<g class="sn"><circle cx="351" cy="538" r="10"/><text x="351" y="542" text-anchor="middle">3</text></g>
<text class="at" x="345" y="569">after you confirm; stops at the VM if it</text>
<text class="at" x="345" y="586">cannot be removed</text>
</g>
<g class="bx-store"><rect x="740" y="517" width="270" height="84" rx="3"/>
<text class="st" x="875" y="531" text-anchor="middle">«task»</text>
<text class="nm" x="875" y="547" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="740" y1="554" x2="1010" y2="554"/>
<text class="at" x="750" y="569">LazyVM-Maintain-&lt;VM&gt;</text>
<text class="at" x="750" y="586">LazyVM-ResumeAfterReboot-&lt;VM&gt;</text>
</g>
<g class="bx-store"><rect x="740" y="613" width="270" height="84" rx="3"/>
<text class="st" x="875" y="627" text-anchor="middle">«registry»</text>
<text class="nm" x="875" y="643" text-anchor="middle">HKLM:\SOFTWARE\LazyVM\&lt;VM&gt;</text>
<line class="div" x1="740" y1="650" x2="1010" y2="650"/>
<text class="at" x="750" y="665">deleted</text>
</g>
<g class="bx-store"><rect x="740" y="709" width="270" height="84" rx="3"/>
<text class="st" x="875" y="723" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="875" y="739" text-anchor="middle">Hyper-V</text>
<line class="div" x1="740" y1="746" x2="1010" y2="746"/>
<text class="at" x="750" y="761">VM &lt;VM&gt; turned off</text>
<text class="at" x="750" y="778">removed</text>
</g>
<g class="bx-mod"><rect x="335" y="821" width="305" height="350" rx="3"/>
<text class="st" x="500.5" y="835" text-anchor="middle">«Maintenance»</text>
<text class="nm" x="500.5" y="851" text-anchor="middle">Remove-PathWithRetry()</text>
<line class="div" x1="335" y1="858" x2="640" y2="858"/>
<g class="sn"><circle cx="351" cy="842" r="10"/><text x="351" y="846" text-anchor="middle">4</text></g>
<text class="at" x="345" y="873">called by Invoke-VMRemoval</text>
<text class="at" x="345" y="890">what is outside the VM folder first,</text>
<text class="at" x="345" y="907">then the folder; the log goes last,</text>
<text class="at" x="345" y="924">after Stop-Log closes it</text>
</g>
<g class="bx-store"><rect x="740" y="821" width="270" height="152" rx="3"/>
<text class="st" x="875" y="835" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="851" text-anchor="middle">Files outside the VM folder</text>
<line class="div" x1="740" y1="858" x2="1010" y2="858"/>
<text class="at" x="750" y="873">Shared\Credentials\.lazyvm.key if</text>
<text class="at" x="750" y="890">no other VM uses it</text>
<text class="at" x="750" y="907">disks</text>
<text class="at" x="750" y="924">state or backups that a setting put</text>
<text class="at" x="750" y="941">elsewhere; anything another VM uses</text>
<text class="at" x="750" y="958">is kept</text>
</g>
<g class="bx-store"><rect x="740" y="985" width="270" height="186" rx="3"/>
<text class="st" x="875" y="999" text-anchor="middle">«folder»</text>
<text class="nm" x="875" y="1015" text-anchor="middle">VM folder</text>
<line class="div" x1="740" y1="1022" x2="1010" y2="1022"/>
<text class="at" x="750" y="1037">&lt;VM&gt;\ and everything in it: Config</text>
<text class="at" x="750" y="1054">Disks</text>
<text class="at" x="750" y="1071">Checkpoints</text>
<text class="at" x="750" y="1088">State</text>
<text class="at" x="750" y="1105">Backups</text>
<text class="at" x="750" y="1122">Credentials</text>
<text class="at" x="750" y="1139">Logs</text>
<text class="at" x="750" y="1156">Virtual Machines; the log last</text>
</g>
</svg>
