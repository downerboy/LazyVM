<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 607" width="1030" height="607" role="img" aria-labelledby="t-status">
<title id="t-status">List VMs: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="607"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,67.5 L305,67.5 L305,530"/>
<path class="cl" d="M305,149 L335,149" marker-end="url(#ac)"/>
<path class="cl" d="M305,240 L335,240" marker-end="url(#ac)"/>
<path class="cl" d="M305,331 L335,331" marker-end="url(#ac)"/>
<path class="cl" d="M305,439 L335,439" marker-end="url(#ac)"/>
<path class="cl" d="M305,530 L335,530" marker-end="url(#ac)"/>
<path class="df" d="M275,162.5 L335,162.5" marker-end="url(#ad)"/>
<path class="df" d="M275,253.5 L335,253.5" marker-end="url(#ad)"/>
<path class="df" d="M275,353.0 L335,353.0" marker-end="url(#ad)"/>
<path class="df" d="M275,452.5 L335,452.5" marker-end="url(#ad)"/>
<path class="df" d="M275,543.5 L335,543.5" marker-end="url(#ad)"/>
<path class="df" d="M640,543.5 L740,543.5" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="162.5" r="10"/><text x="293" y="166.0" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="253.5" r="10"/><text x="293" y="257.0" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="353.0" r="10"/><text x="293" y="356.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="452.5" r="10"/><text x="293" y="456.0" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="293" cy="543.5" r="10"/><text x="293" y="547.0" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690.0" cy="543.5" r="10"/><text x="690.0" y="547.0" text-anchor="middle">D6</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Get-LazyVM</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name  (wildcards, default *)</text>
</g>
<g class="bx-mod"><rect x="335" y="129" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="143" text-anchor="middle">«Settings»</text>
<text class="nm" x="487.5" y="159" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="166" x2="640" y2="166"/>
<g class="sn"><circle cx="351" cy="150" r="10"/><text x="351" y="154" text-anchor="middle">1</text></g>
</g>
<g class="bx-store"><rect x="20" y="129" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="143" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="159" text-anchor="middle">HKLM:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="166" x2="275" y2="166"/>
<text class="at" x="30" y="181">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="220" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="234" text-anchor="middle">«Settings»</text>
<text class="nm" x="487.5" y="250" text-anchor="middle">Get-VMProfileName()</text>
<line class="div" x1="335" y1="257" x2="640" y2="257"/>
<g class="sn"><circle cx="351" cy="241" r="10"/><text x="351" y="245" text-anchor="middle">2</text></g>
</g>
<g class="bx-store"><rect x="20" y="220" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="234" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="250" text-anchor="middle">*\Config\</text>
<line class="div" x1="20" y1="257" x2="275" y2="257"/>
<text class="at" x="30" y="272">VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="311" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="325" text-anchor="middle">«Settings»</text>
<text class="nm" x="487.5" y="341" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="348" x2="640" y2="348"/>
<g class="sn"><circle cx="351" cy="332" r="10"/><text x="351" y="336" text-anchor="middle">3</text></g>
<text class="at" x="345" y="363">per VM</text>
</g>
<g class="bx-store"><rect x="20" y="311" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="325" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="341" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="348" x2="275" y2="348"/>
<text class="at" x="30" y="363">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="380">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="419" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="433" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="487.5" y="449" text-anchor="middle">Get-VM()</text>
<line class="div" x1="335" y1="456" x2="640" y2="456"/>
<g class="sn"><circle cx="351" cy="440" r="10"/><text x="351" y="444" text-anchor="middle">4</text></g>
<text class="at" x="345" y="471">per VM</text>
</g>
<g class="bx-store"><rect x="20" y="419" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="433" text-anchor="middle">«Hyper-V»</text>
<text class="nm" x="147.5" y="449" text-anchor="middle">Hyper-V</text>
<line class="div" x1="20" y1="456" x2="275" y2="456"/>
<text class="at" x="30" y="471">VM state</text>
</g>
<g class="bx-mod"><rect x="335" y="510" width="305" height="67" rx="3"/>
<text class="st" x="487.5" y="524" text-anchor="middle">«ScheduledTasks»</text>
<text class="nm" x="487.5" y="540" text-anchor="middle">Get-ScheduledTask()</text>
<line class="div" x1="335" y1="547" x2="640" y2="547"/>
<g class="sn"><circle cx="351" cy="531" r="10"/><text x="351" y="535" text-anchor="middle">5</text></g>
<text class="at" x="345" y="562">per VM</text>
</g>
<g class="bx-store"><rect x="20" y="510" width="255" height="67" rx="3"/>
<text class="st" x="147.5" y="524" text-anchor="middle">«task»</text>
<text class="nm" x="147.5" y="540" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="20" y1="547" x2="275" y2="547"/>
<text class="at" x="30" y="562">LazyVM-Maintain-&lt;VM&gt;</text>
</g>
<g class="bx-store"><rect x="740" y="510" width="270" height="67" rx="3"/>
<text class="st" x="875.0" y="524" text-anchor="middle">«output»</text>
<text class="nm" x="875.0" y="540" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="547" x2="1010" y2="547"/>
<text class="at" x="750" y="562">LazyVM.VM per VM</text>
</g>
</svg>
