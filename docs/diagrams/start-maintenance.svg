<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 838" width="1030" height="838" role="img" aria-labelledby="t-start-maintenance">
<title id="t-start-maintenance">Run maintenance now: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="838"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,648"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,188 L335,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,278 L335,278" marker-end="url(#ac)"/>
<path class="df" d="M275,300 L335,300" marker-end="url(#ad)"/>
<path class="cl" d="M305,390 L335,390" marker-end="url(#ac)"/>
<path class="df" d="M275,420.5 L335,420.5" marker-end="url(#ad)"/>
<path class="cl" d="M305,519 L335,519" marker-end="url(#ac)"/>
<path class="df" d="M275,541 L335,541" marker-end="url(#ad)"/>
<path class="cl" d="M305,648 L335,648" marker-end="url(#ac)"/>
<path class="df" d="M640,670 L740,670" marker-end="url(#ad)"/>
<path class="df" d="M640,766 L740,766" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="300" r="10"/><text x="293" y="303.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="293" cy="420.5" r="10"/><text x="293" y="424" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="293" cy="541" r="10"/><text x="293" y="544.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="670" r="10"/><text x="690" y="673.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="766" r="10"/><text x="690" y="769.5" text-anchor="middle">D6</text></g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">Start-LazyVMMaintenance</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Name &lt;VM&gt; (optional with one VM)</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Resolve-LazyVMRoot()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">the LazyVM folder</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">Root</text>
</g>
<g class="bx-mod"><rect x="335" y="258" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="272" text-anchor="middle">«Settings»</text>
<text class="nm" x="500.5" y="288" text-anchor="middle">Read-VMSetting()</text>
<line class="div" x1="335" y1="295" x2="640" y2="295"/>
<g class="sn"><circle cx="351" cy="279" r="10"/><text x="351" y="283" text-anchor="middle">2</text></g>
<text class="at" x="345" y="310">read-only: the VM&apos;s Config folder and</text>
<text class="at" x="345" y="327">its maintenance task&apos;s name</text>
</g>
<g class="bx-store"><rect x="20" y="258" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="272" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="288" text-anchor="middle">Settings files</text>
<line class="div" x1="20" y1="295" x2="275" y2="295"/>
<text class="at" x="30" y="310">Shared\Config\LazyVM.Settings.json</text>
<text class="at" x="30" y="327">&lt;VM&gt;\Config\VM.json</text>
</g>
<g class="bx-mod"><rect x="335" y="370" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="384" text-anchor="middle">«Common»</text>
<text class="nm" x="500.5" y="400" text-anchor="middle">Get-VMRunState()</text>
<line class="div" x1="335" y1="407" x2="640" y2="407"/>
<g class="sn"><circle cx="351" cy="391" r="10"/><text x="351" y="395" text-anchor="middle">3</text></g>
<text class="at" x="345" y="422">the run going now; stops, saying so,</text>
<text class="at" x="345" y="439">while a build, maintenance or rebuild is</text>
<text class="at" x="345" y="456">running</text>
</g>
<g class="bx-store"><rect x="20" y="370" width="255" height="101" rx="3"/>
<text class="st" x="147.5" y="384" text-anchor="middle">«file»</text>
<text class="nm" x="147.5" y="400" text-anchor="middle">&lt;VM&gt;\Config\</text>
<line class="div" x1="20" y1="407" x2="275" y2="407"/>
<text class="at" x="30" y="422">Run.lock (held or not)</text>
<text class="at" x="30" y="439">Run.json</text>
<text class="at" x="30" y="456">Run.stop</text>
</g>
<g class="bx-mod"><rect x="335" y="499" width="305" height="101" rx="3"/>
<text class="st" x="500.5" y="513" text-anchor="middle">«Task Scheduler»</text>
<text class="nm" x="500.5" y="529" text-anchor="middle">Get-ScheduledTask()</text>
<line class="div" x1="335" y1="536" x2="640" y2="536"/>
<g class="sn"><circle cx="351" cy="520" r="10"/><text x="351" y="524" text-anchor="middle">4</text></g>
<text class="at" x="345" y="551">the maintenance task; stops, saying so,</text>
<text class="at" x="345" y="568">when it is not registered or is running</text>
<text class="at" x="345" y="585">already</text>
</g>
<g class="bx-store"><rect x="20" y="499" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="513" text-anchor="middle">«task»</text>
<text class="nm" x="147.5" y="529" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="20" y1="536" x2="275" y2="536"/>
<text class="at" x="30" y="551">LazyVM-Maintain-&lt;VM&gt;</text>
<text class="at" x="30" y="568">State</text>
</g>
<g class="bx-mod"><rect x="335" y="628" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="642" text-anchor="middle">«Task Scheduler»</text>
<text class="nm" x="500.5" y="658" text-anchor="middle">Start-ScheduledTask()</text>
<line class="div" x1="335" y1="665" x2="640" y2="665"/>
<g class="sn"><circle cx="351" cy="649" r="10"/><text x="351" y="653" text-anchor="middle">5</text></g>
<text class="at" x="345" y="680">unless -WhatIf: starts the task, which</text>
<text class="at" x="345" y="697">runs Invoke-LazyVMMaintenance as SYSTEM</text>
</g>
<g class="bx-store"><rect x="740" y="628" width="270" height="84" rx="3"/>
<text class="st" x="875" y="642" text-anchor="middle">«task»</text>
<text class="nm" x="875" y="658" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="740" y1="665" x2="1010" y2="665"/>
<text class="at" x="750" y="680">LazyVM-Maintain-&lt;VM&gt; (started)</text>
</g>
<g class="bx-store"><rect x="740" y="724" width="270" height="84" rx="3"/>
<text class="st" x="875" y="738" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="754" text-anchor="middle">Pipeline</text>
<line class="div" x1="740" y1="761" x2="1010" y2="761"/>
<text class="at" x="750" y="776">LazyVM.MaintenanceStart: Name,</text>
<text class="at" x="750" y="793">TaskName, Started</text>
</g>
</svg>
