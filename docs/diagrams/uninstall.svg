<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 789" width="1030" height="789" role="img" aria-labelledby="t-uninstall">
<title id="t-uninstall">Uninstall: calls in order, with data flowing in from the left and out to the right</title>
<style>
svg{--bg:#ffffff;--fg:#17202a;--muted:#52606d;--line:#9aa5b1;--mod:#eef2f6;--store:#fbf6ea;--cmd:#e9eef9;--call:#1f5fbf;--data:#b86e00;--on:#ffffff}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--muted:#9da7b3;--line:#5d6b78;--mod:#1d2733;--store:#2a2418;--cmd:#1b2537;--call:#6ea2ff;--data:#f2a93b;--on:#0d1117}}
text{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:var(--fg)}
.bg{fill:var(--bg)}
.cap{font:600 11px system-ui,"Segoe UI",sans-serif;letter-spacing:.12em;fill:var(--muted)}
.bx-cmd rect{fill:var(--cmd);stroke:var(--fg);stroke-width:1.6}
.bx-caller rect{fill:var(--cmd);stroke:var(--call);stroke-width:1.2;stroke-dasharray:3 3}
.bx-mod rect{fill:var(--mod);stroke:var(--line);stroke-width:1.2}
.bx-store rect{fill:var(--store);stroke:var(--data);stroke-width:1.2;stroke-dasharray:6 3}
.st{font-size:10px;fill:var(--muted)}
.nm{font-size:13px;font-weight:600}
.div{stroke:var(--line)}
.at{font-size:11.5px;fill:var(--muted)}
.cl{fill:none;stroke:var(--call);stroke-width:2}
.df{fill:none;stroke:var(--data);stroke-width:2;stroke-dasharray:7 4}
.sn circle{fill:var(--call)} .sn text{font:600 10px system-ui,sans-serif;fill:var(--on)}
.bd circle{fill:var(--data)} .bd text{font:600 9px system-ui,sans-serif;fill:var(--on)}
.mk-c{fill:var(--call)} .mk-d{fill:var(--data)}
</style>
<defs>
<marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-c" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-d" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1030" height="789"/>
<text class="cap" x="20" y="16">INPUTS</text>
<text class="cap" x="335" y="16">CALLS IN ORDER</text>
<text class="cap" x="740" y="16">OUTPUTS</text>
<path class="cl" d="M335,76 L305,76 L305,486"/>
<path class="cl" d="M275,58 L335,58" marker-end="url(#ac)"/>
<path class="cl" d="M305,166 L335,166" marker-end="url(#ac)"/>
<path class="df" d="M275,188 L335,188" marker-end="url(#ad)"/>
<path class="df" d="M275,284 L335,284" marker-end="url(#ad)"/>
<path class="df" d="M640,188 L740,188" marker-end="url(#ad)"/>
<path class="cl" d="M305,374 L335,374" marker-end="url(#ac)"/>
<path class="df" d="M640,396 L740,396" marker-end="url(#ad)"/>
<path class="cl" d="M305,486 L335,486" marker-end="url(#ac)"/>
<path class="df" d="M640,508 L740,508" marker-end="url(#ad)"/>
<path class="df" d="M640,612.5 L740,612.5" marker-end="url(#ad)"/>
<path class="df" d="M640,717 L740,717" marker-end="url(#ad)"/>
<g class="bd"><circle cx="293" cy="188" r="10"/><text x="293" y="191.5" text-anchor="middle">D1</text></g>
<g class="bd"><circle cx="293" cy="284" r="10"/><text x="293" y="287.5" text-anchor="middle">D2</text></g>
<g class="bd"><circle cx="690" cy="188" r="10"/><text x="690" y="191.5" text-anchor="middle">D3</text></g>
<g class="bd"><circle cx="690" cy="396" r="10"/><text x="690" y="399.5" text-anchor="middle">D4</text></g>
<g class="bd"><circle cx="690" cy="508" r="10"/><text x="690" y="511.5" text-anchor="middle">D5</text></g>
<g class="bd"><circle cx="690" cy="612.5" r="10"/><text x="690" y="616" text-anchor="middle">D6</text></g>
<g class="bd"><circle cx="690" cy="717" r="10"/><text x="690" y="720.5" text-anchor="middle">D7</text></g>
<g class="bx-caller"><rect x="20" y="34" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="48" text-anchor="middle">«double-click»</text>
<text class="nm" x="147.5" y="64" text-anchor="middle">Uninstall LazyVM.cmd</text>
<line class="div" x1="20" y1="71" x2="275" y2="71"/>
<text class="at" x="30" y="86">asks for administrator rights</text>
<text class="at" x="30" y="103">needs PowerShell 7.6</text>
</g>
<g class="bx-cmd"><rect x="335" y="34" width="305" height="84" rx="3"/>
<text class="st" x="487.5" y="48" text-anchor="middle">«command»</text>
<text class="nm" x="487.5" y="64" text-anchor="middle">.\LazyVM\Install.ps1</text>
<line class="div" x1="335" y1="71" x2="640" y2="71"/>
<text class="at" x="345" y="86">-Uninstall</text>
</g>
<g class="bx-mod"><rect x="335" y="146" width="305" height="180" rx="3"/>
<text class="st" x="500.5" y="160" text-anchor="middle">«Install.ps1»</text>
<text class="nm" x="500.5" y="176" text-anchor="middle">Get-UninstallPlan()</text>
<line class="div" x1="335" y1="183" x2="640" y2="183"/>
<g class="sn"><circle cx="351" cy="167" r="10"/><text x="351" y="171" text-anchor="middle">1</text></g>
<text class="at" x="345" y="198">what goes and what stays, shown before</text>
<text class="at" x="345" y="215">anything is removed; nothing goes unless</text>
<text class="at" x="345" y="232">you confirm</text>
</g>
<g class="bx-store"><rect x="20" y="146" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="160" text-anchor="middle">«task»</text>
<text class="nm" x="147.5" y="176" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="20" y1="183" x2="275" y2="183"/>
<text class="at" x="30" y="198">LazyVM-Maintain-&lt;VM&gt;</text>
<text class="at" x="30" y="215">LazyVM-ResumeAfterReboot-&lt;VM&gt;</text>
</g>
<g class="bx-store"><rect x="20" y="242" width="255" height="84" rx="3"/>
<text class="st" x="147.5" y="256" text-anchor="middle">«registry»</text>
<text class="nm" x="147.5" y="272" text-anchor="middle">HKCU:\SOFTWARE\LazyVM</text>
<line class="div" x1="20" y1="279" x2="275" y2="279"/>
<text class="at" x="30" y="294">Root</text>
</g>
<g class="bx-store"><rect x="740" y="146" width="270" height="84" rx="3"/>
<text class="st" x="875" y="160" text-anchor="middle">«output»</text>
<text class="nm" x="875" y="176" text-anchor="middle">Console</text>
<line class="div" x1="740" y1="183" x2="1010" y2="183"/>
<text class="at" x="750" y="198">Removes: ...</text>
<text class="at" x="750" y="215">Keeps: ...</text>
</g>
<g class="bx-mod"><rect x="335" y="354" width="305" height="84" rx="3"/>
<text class="st" x="500.5" y="368" text-anchor="middle">«Install.ps1»</text>
<text class="nm" x="500.5" y="384" text-anchor="middle">Unregister-LazyVMHostTask()</text>
<line class="div" x1="335" y1="391" x2="640" y2="391"/>
<g class="sn"><circle cx="351" cy="375" r="10"/><text x="351" y="379" text-anchor="middle">2</text></g>
<text class="at" x="345" y="406">each one listed; one that cannot go is</text>
<text class="at" x="345" y="423">named</text>
</g>
<g class="bx-store"><rect x="740" y="354" width="270" height="84" rx="3"/>
<text class="st" x="875" y="368" text-anchor="middle">«task»</text>
<text class="nm" x="875" y="384" text-anchor="middle">Task Scheduler</text>
<line class="div" x1="740" y1="391" x2="1010" y2="391"/>
<text class="at" x="750" y="406">LazyVM-Maintain-&lt;VM&gt;</text>
<text class="at" x="750" y="423">LazyVM-ResumeAfterReboot-&lt;VM&gt;</text>
</g>
<g class="bx-mod"><rect x="335" y="466" width="305" height="293" rx="3"/>
<text class="st" x="500.5" y="480" text-anchor="middle">«Install.ps1»</text>
<text class="nm" x="500.5" y="496" text-anchor="middle">Remove-InstalledItem()</text>
<line class="div" x1="335" y1="503" x2="640" y2="503"/>
<g class="sn"><circle cx="351" cy="487" r="10"/><text x="351" y="491" text-anchor="middle">3</text></g>
<text class="at" x="345" y="518">a folder is renamed first, so an app</text>
<text class="at" x="345" y="535">that is running is kept whole; nothing</text>
<text class="at" x="345" y="552">that is or holds a link is removed</text>
</g>
<g class="bx-store"><rect x="740" y="466" width="270" height="84" rx="3"/>
<text class="st" x="875" y="480" text-anchor="middle">«file»</text>
<text class="nm" x="875" y="496" text-anchor="middle">all-users Start menu</text>
<line class="div" x1="740" y1="503" x2="1010" y2="503"/>
<text class="at" x="750" y="518">LazyVM.lnk</text>
</g>
<g class="bx-store"><rect x="740" y="562" width="270" height="101" rx="3"/>
<text class="st" x="875" y="576" text-anchor="middle">«folder»</text>
<text class="nm" x="875" y="592" text-anchor="middle">%ProgramFiles%\LazyVM\</text>
<line class="div" x1="740" y1="599" x2="1010" y2="599"/>
<text class="at" x="750" y="614">App\</text>
<text class="at" x="750" y="631">Modules\</text>
<text class="at" x="750" y="648">the folder itself, once empty</text>
</g>
<g class="bx-store"><rect x="740" y="675" width="270" height="84" rx="3"/>
<text class="st" x="875" y="689" text-anchor="middle">«registry»</text>
<text class="nm" x="875" y="705" text-anchor="middle">HKCU:\Environment</text>
<line class="div" x1="740" y1="712" x2="1010" y2="712"/>
<text class="at" x="750" y="727">PSModulePath</text>
</g>
</svg>
