# Keeps a release pull request open that holds the next version: on every
# push to main, release-please reads the merged pull request titles, bumps
# ModuleVersion in the manifest and adds them to CHANGELOG.md. Merging that
# pull request tags main (v2.1.0) and publishes the release, and the publish
# job attaches the built zip. A release/x.y branch gets its own release pull
# request the same way, for patching an older version.
name: Release Please

on:
  push:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  # While LazyVM is in alpha, every release is marked as a pre-release.
  PRERELEASE: 'true'

jobs:
  release-please:
    name: Update the release pull request
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # A pull request opened or updated with the workflow's own token does
      # not start other workflows, so the checks main requires are started
      # here, on the release pull request's branch.
      - name: Run the required checks on the release pull request
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  publish:
    name: Build, test and attach the release zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build, analyze and test
        run: ./build.ps1 -Bootstrap

      - name: Package
        run: ./build.ps1 -Task Package

      - name: Attach the zip and install notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $zip = Get-Item out/release/*.zip
          $expected = "LazyVM-$($env:TAG.TrimStart('v')).zip"
          if ($zip.Name -ne $expected) {
              throw "The tag $env:TAG does not match the module manifest, which packaged $($zip.Name)."
          }
          gh release upload $env:TAG $zip.FullName

          $install = @"
          ## Install

          In **PowerShell 7** (``pwsh``) **as administrator**, in the folder you downloaded the zip to:

          ``````powershell
          Unblock-File .\$($zip.Name)
          Expand-Archive .\$($zip.Name) -DestinationPath .\LazyVM -Force
          .\LazyVM\Install.ps1
          ``````

          Then open a new PowerShell 7 window as administrator and run:

          ``````powershell
          Build-LazyVM -Name DevBox
          ``````

          See the README in the zip, or [docs/Guide.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:TAG/docs/Guide.md), for the rest.
          "@ -replace '(?m)^          ', ''
          $changes = gh release view $env:TAG --json body --jq .body
          Set-Content -Path notes.md -Value "$install`n$changes"

          $flags = @('--notes-file', 'notes.md', '--title', "LazyVM $($env:TAG.TrimStart('v'))")
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release edit $env:TAG @flags
