# Keeps a release pull request open that holds the next version: on every
# push to main, release-please reads the merged pull request titles, bumps
# ModuleVersion in the manifest and adds them to CHANGELOG.md. Merging that
# pull request makes a draft release (v2.1.0); the publish job builds and
# tests it, attaches the zip and publishes it, which tags the commit.
# Releases are immutable once published, so the zip has to go on before.
# A release/x.y branch gets its own release pull request the same way, for
# patching an older version.
name: Release Please

on:
  push:
    branches: [ main, 'release/**' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Build, attach the zip to and publish this draft release instead, such as v2.1.0
        required: false

# Nothing by default: each job asks for only what it needs.
permissions: {}

env:
  # While LazyVM is in alpha, every release is marked as a pre-release.
  PRERELEASE: 'true'

jobs:
  release-please:
    name: Update the release pull request
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To start the required checks on the release pull request.
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to a commit, not a tag, so it cannot change under us;
      # Dependabot proposes updates.
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      # A pull request opened or updated with the workflow's own token does
      # not start other workflows, so the checks main requires are started
      # here, on the release pull request's branch.
      # After a release there is no pull request, and the output is empty.
      - name: Run the required checks on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          if [[ -z "$PR" ]]; then
            echo 'No release pull request to check.'
            exit 0
          fi
          branch=$(jq -r .headBranchName <<< "$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  publish:
    name: Build, test and attach the release zip
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    runs-on: windows-latest
    permissions:
      # To edit, upload to and publish the draft release.
      contents: write
    defaults:
      run:
        shell: pwsh
    # The token is given only to the steps that call gh, never to the build
    # and tests, which run code installed from the PowerShell Gallery.
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # A draft release has no tag yet, only the commit it will tag.
      - name: Find the release's commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish | ConvertFrom-Json
          if (-not $release.isDraft) {
              throw "$env:TAG is already published. Published releases are immutable, so the zip cannot be added."
          }
          "sha=$($release.targetCommitish)" >> $env:GITHUB_OUTPUT

      # The token is not left in .git/config, where the build could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - name: Build, analyze and test
        run: ./Invoke-AnalyzerAndTest.ps1

      - name: Package
        run: ./New-ReleasePackage.ps1

      - name: Attach the zip and install notes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Get-Item out/release/*.zip
          $expected = "LazyVM-$($env:TAG.TrimStart('v')).zip"
          if ($zip.Name -ne $expected) {
              throw "The tag $env:TAG does not match the module manifest, which packaged $($zip.Name)."
          }

          $install = @"
          ## Install

          In **PowerShell 7** (``pwsh``) **as administrator**, in the folder you downloaded the zip to:

          ``````powershell
          Unblock-File .\$($zip.Name)
          Expand-Archive .\$($zip.Name) -DestinationPath .\LazyVM -Force
          .\LazyVM\Install.ps1
          ``````

          Then open a new PowerShell 7 window as administrator and run:

          ``````powershell
          Build-LazyVM -Name DevBox
          ``````

          See the README in the zip, or [docs/Guide.md](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:TAG/docs/Guide.md), for the rest.
          "@ -replace '(?m)^          ', ''
          # Run again on the same release, the install notes are replaced, not repeated.
          $changes = (gh release view $env:TAG --json body --jq .body) -join "`n"
          $changes = $changes -replace '(?sm)^## Install.*?(?=^## \d)', ''
          Set-Content -Path notes.md -Value "$install`n$changes"

          $flags = @('--notes-file', 'notes.md', '--title', "LazyVM $($env:TAG.TrimStart('v'))")
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release edit $env:TAG @flags
          gh release upload $env:TAG $zip.FullName --clobber

          # Publishing tags the commit and makes the release immutable.
          gh release edit $env:TAG --draft=false
