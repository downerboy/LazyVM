# Builds, analyzes and tests LazyVM on every pull request and on every push
# to main or a release branch, on Windows with PowerShell 7, the only place
# LazyVM runs. Other branches are checked through their pull request.
name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Build, analyze and test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell version
        run: $PSVersionTable

      - name: Build, analyze and test
        run: ./build.ps1 -Bootstrap

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: out/testResults.xml

      - name: Upload the built module
        uses: actions/upload-artifact@v4
        with:
          name: LazyVM
          path: out/LazyVM

      # A run started by hand, as release-please does for its release pull
      # request, is not counted toward the checks main requires. Its result
      # is reported again as a commit status of the same name, which is.
      - name: Report the result as a commit status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $state = if ($env:RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context='Build, analyze and test' -f target_url=$env:RUN_URL -f description="CI $env:RESULT" | Out-Null
