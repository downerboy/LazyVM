# Builds, analyzes and tests LazyVM on every pull request and on every push
# to main or a release branch, on Windows with PowerShell 7, the only place
# LazyVM runs. Other branches are checked through their pull request.
name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
  workflow_dispatch:

# Nothing by default: each job asks for only what it needs.
permissions: {}

jobs:
  build:
    name: Build, analyze and test
    runs-on: windows-latest
    permissions:
      contents: read
      statuses: write
    defaults:
      run:
        shell: pwsh
    steps:
      # Actions are pinned to a commit, not a tag, so they cannot change
      # under us; Dependabot proposes updates. The token is not left in
      # .git/config, where the build and tests could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PowerShell version
        run: $PSVersionTable

      - name: Build, analyze and test
        run: ./Invoke-AnalyzerAndTest.ps1

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: out/testResults.xml

      - name: Upload the built module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LazyVM
          path: out/LazyVM

      # A run started by hand, as release-please does for its release pull
      # request, is not counted toward the checks main requires. Its result
      # is reported again as a commit status of the same name, which is.
      - name: Report the result as a commit status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $state = if ($env:RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context='Build, analyze and test' -f target_url=$env:RUN_URL -f description="CI $env:RESULT" | Out-Null

  # Builds and tests the .NET solution of the GUI dashboard (#305). Until the
  # solution is added the job finds nothing to do and passes.
  dotnet:
    name: Build and test .NET
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      SOLUTION: src/DownerBoy.LazyVM.slnx
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for the solution
        id: solution
        run: |
          $exists = Test-Path -LiteralPath $env:SOLUTION -PathType Leaf
          if (-not $exists) { "::notice::$env:SOLUTION does not exist yet; nothing to build." }
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.solution.outputs.exists == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: steps.solution.outputs.exists == 'true'
        run: dotnet build $env:SOLUTION --configuration Release

      - name: Test
        if: steps.solution.outputs.exists == 'true'
        run: dotnet test $env:SOLUTION --configuration Release --no-build --logger trx --results-directory out/dotnet-test-results

      - name: Upload the test results
        if: always() && steps.solution.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results
          path: out/dotnet-test-results
