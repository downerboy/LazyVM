name: Feature request
description: Suggest something new.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do that you cannot do now
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like LazyVM to do
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
