name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LazyVM version
      description: The output of `(Get-Module LazyVM -ListAvailable).Version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Output of Test-LazyVM
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Host Windows edition and build
